# Formatting belongs to ktlint. Test DSL blocks describe scenarios rather than production functions.
complexity:
  LargeClass:
    allowedLines: 599
  NestedBlockDepth:
    allowedDepth: 3
  LongMethod:
    allowedLines: 59
    excludes: ['**/test/**', '**/commonTest/**', '**/jvmTest/**', '**/integrationTest/**']
  LongParameterList:
    ignoreDataClasses: true
    excludes: ['**/test/**', '**/commonTest/**', '**/jvmTest/**', '**/integrationTest/**']
  TooManyFunctions:
    allowedFunctionsPerFile: 10
    allowedFunctionsPerClass: 10
    allowedFunctionsPerInterface: 10
    allowedFunctionsPerObject: 10
    allowedFunctionsPerEnum: 10
    ignorePrivate: true
    ignoreOverridden: true
style:
  MagicNumber:
    active: false # domain algorithms use seconds, bit masks and binary format constants
  MaxLineLength:
    active: false # ktlint owns line length
  ReturnCount:
    max: 4
    excludeGuardClauses: true

# Constructor/API changes are deferred; see docs/setup/t1-notes.md (8 findings).
coroutines:
  InjectDispatcher:
    active: false
potential-bugs:
  # Analysis API cannot resolve serialization compiler-generated serializer() here (3 false positives).
  # The Kotlin compiler still rejects unreachable code through allWarningsAsErrors.
  UnreachableCode:
    active: false
  UnsafeCallOnNullableType:
    excludes: ['**/test/**', '**/commonTest/**', '**/jvmTest/**', '**/integrationTest/**', '**/testFixtures/**']
