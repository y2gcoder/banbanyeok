# 아키텍처 지표 전용 덧씌움 설정. 평소 detekt(CI)에는 쓰이지 않고, -PdetektMetrics=true 일 때만 detekt.yml 뒤에 겹쳐진다.
# CI 기준(detekt.yml)은 통과 상태라 경고가 0건이다. 그래서 지표용으로는 기준을 낮춰 "곧 임계에 닿는 함수"를 순위로 보이게 한다.
# 이 설정은 빌드를 실패시키지 않는다(quality 플러그인이 ignoreFailures를 켠다). 규칙을 바꾸면 이슈의 숫자 기준도 바뀌므로 함께 갱신한다.
complexity:
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 8
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 10
  NestedBlockDepth:
    active: true
    allowedDepth: 3
  LongMethod:
    active: true
    allowedLines: 40
  LongParameterList:
    active: true
    allowedFunctionParameters: 5
    allowedConstructorParameters: 6
