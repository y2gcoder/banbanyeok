<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#62 귀갓길 막차 — 화면 시안 (fable)</title>
<!--
  설계 시안용 정적 페이지다(구현 아님). 토큰·치수는 web/src/app/globals.css와 결과 카드 컴포넌트를 옮겨 적었다.
  시각·소요시간은 예시 값이다. 그리는 법: spikes/last-train-design/mock/shoot.mjs
-->
<style>
@font-face {
  font-family: "Pretendard Variable";
  font-weight: 45 920;
  src: url("../../../web/node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
}
:root {
  --platform: #eef1f0; --surface: #ffffff; --ink: #16201b; --ink-soft: #3a4640; --muted: #56625c;
  --rule: #d3dad7; --rule-strong: #aeb8b3; --safety: #f5c518; --safety-ink: #5c4500;
  --p1: #1f5bd0; --p2: #e0531c; --p3: #12936a; --p4: #8b4fc4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", sans-serif;
  font-feature-settings: "ss06"; color: var(--ink); background: #cfd6d3;
  word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased;
  padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;
}
.tabular { font-variant-numeric: tabular-nums; }
.shot { display: flex; gap: 16px; align-items: flex-start; background: #cfd6d3; padding: 16px; }
.frame { width: 360px; }
.caption { font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 0 4px 8px; }
.phone { width: 360px; background: var(--platform); padding: 16px 20px 24px; }
.basisline { font-size: 13px; color: var(--muted); padding: 0 2px 10px; }
.card {
  display: flex; flex-direction: column; gap: 20px; border-radius: 22px; border: 1px solid var(--rule);
  background: var(--surface); padding: 20px; box-shadow: 0 1px 0 var(--rule);
}
.head { display: flex; gap: 12px; align-items: flex-start; }
.ring { width: 28px; height: 28px; flex: none; }
.rank { font-size: 13px; font-weight: 700; color: var(--safety-ink); }
.rank span { background: var(--safety); border-radius: 4px; padding: 2px 6px; }
.station { font-size: 27px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; margin: 6px 0; }
.badges { display: inline-flex; gap: 4px; }
.badge { display: inline-flex; height: 20px; min-width: 20px; align-items: center; justify-content: center;
  border-radius: 999px; padding: 0 6px; font-size: 11px; font-weight: 700; color: #fff; }
.badge.round { padding: 0; width: 20px; }
.rails { display: flex; flex-direction: column; gap: 14px; }
.rail-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.rail-name { font-size: 15px; font-weight: 700; }
.rail-name small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.rail-note { font-size: 13px; color: var(--muted); margin-left: 6px; font-weight: 400; }
.rail-min { font-size: 22px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
.track { position: relative; height: 14px; margin-top: 6px; }
.track i { position: absolute; left: 0; right: 0; top: 5.5px; height: 3px; border-radius: 99px; background: var(--rule); }
.track b { position: absolute; left: 0; top: 4.5px; height: 5px; border-radius: 99px; }
.track u { position: absolute; top: 1px; width: 12px; height: 12px; border-radius: 99px; border: 3px solid; background: var(--surface); transform: translateX(-50%); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 12px; background: rgba(238, 241, 240, .7); padding: 10px 0; }
.stats div { display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid var(--rule); }
.stats div:first-child { border-left: 0; }
.stats dt { font-size: 12px; color: var(--muted); }
.stats dd { font-size: 15px; font-weight: 700; }
.reason { border-left: 4px solid var(--safety); padding-left: 12px; font-size: 15px; line-height: 1.625; }

/* 새로 더하는 칸: 집에 가는 막차 */
.lt { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--rule); padding-top: 18px; }
.lt-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.lt-head h3 { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
.lt-head span { font-size: 12px; color: var(--muted); }
.lt-sub { font-size: 13px; color: var(--muted); margin-top: -8px; }
.lt-callout { font-size: 14px; line-height: 1.5; background: rgba(245, 197, 24, .22); border-radius: 10px; padding: 9px 12px; }
.lt-callout b { font-weight: 800; }
.lt-list { list-style: none; display: flex; flex-direction: column; }
.lt-list li { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-top: 1px solid var(--rule); }
.lt-list li:first-child { border-top: 0; padding-top: 2px; }
.lt-list li:last-child { padding-bottom: 0; }
.lt-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.lt-who { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lt-name { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; }
.dot { width: 12px; height: 12px; border-radius: 99px; border: 3px solid; background: var(--surface); flex: none; }
.lt-kind { font-size: 13px; color: var(--muted); }
.lt-time { display: flex; align-items: baseline; gap: 5px; flex: none; }
.lt-time strong { font-size: 24px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; }
.lt-time small { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.lt-time .tag { background: var(--ink); color: #fff; border-radius: 5px; padding: 3px 6px; font-size: 11px; font-weight: 700; align-self: center; }
.lt-none { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
.lt-link { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border: 1px solid var(--rule-strong);
  border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--surface); margin-top: 2px; }
.lt-link svg { width: 16px; height: 16px; }
.lt-note { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.chip { display: inline-flex; align-items: center; border-radius: 5px; background: #e2e7e5; color: var(--ink-soft); font-size: 11px; font-weight: 700; padding: 2px 6px; }
.btn-main { display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; }
.btn-row { display: flex; gap: 8px; }
.btn-row span { flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid var(--rule); border-radius: 12px; font-size: 15px; font-weight: 600; }

/* 공유 카드(1200×630) */
.og { width: 1200px; height: 630px; background: var(--platform); display: flex; flex-direction: column; font-weight: 700; }
.og-in { flex: 1; display: flex; flex-direction: column; padding: 40px 64px 30px; }
.og-brand { display: flex; align-items: center; gap: 14px; font-size: 38px; }
.og-title { font-size: 92px; letter-spacing: -4px; line-height: 1.05; margin-top: 10px; }
.og-people { display: flex; margin-top: 22px; }
.og-col { width: 400px; display: flex; flex-direction: column; }
.og-col + .og-col { padding-left: 22px; border-left: 3px solid var(--rule); }
.og-name { display: flex; align-items: center; gap: 10px; height: 36px; font-size: 30px; color: var(--muted); }
.og-dot { width: 22px; height: 22px; border-radius: 22px; border: 6px solid; background: #fff; }
.og-num { font-size: 124px; letter-spacing: -4px; line-height: 1.08; }
.og-last { font-size: 34px; line-height: 1.2; color: var(--ink-soft); display: flex; align-items: center; gap: 12px; }
.og-last em { font-style: normal; background: var(--surface); border: 3px solid var(--ink); border-radius: 10px; padding: 0 10px; font-size: 28px; line-height: 1.35; }
.og-chips { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
.og-chip { background: var(--ink); color: #fff; font-size: 40px; padding: 8px 24px; border-radius: 14px; }
.og-basis { font-size: 28px; color: var(--muted); margin-left: 6px; }
.og-bottom { margin-top: auto; font-size: 30px; line-height: 1.25; color: var(--muted); }
.og-bar { height: 18px; background: var(--safety); }
</style>
</head>
<body>
<script>
const P = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)"];
const pin = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.1 4.1 9 6 3 3.5v14L9 20l6-2.5 6 2.5v-14l-2.5-1"/><path d="M9 6v14M15 4v13.5"/></svg>';

function rails(people) {
  const end = Math.ceil(Math.max(...people.map((p) => p.min)) / 10) * 10;
  return `<div class="rails">${people.map((p, i) => `
    <div><div class="rail-top">
      <p><span class="rail-name">${p.name}${p.me ? "<small>(나)</small>" : ""}</span><span class="rail-note">${p.note}</span></p>
      <span class="rail-min tabular">${p.min}분</span></div>
      <div class="track"><i></i><b style="width:${(p.min / end) * 100}%;background:${P[i]}"></b><u style="left:${(p.min / end) * 100}%;border-color:${P[i]}"></u></div>
    </div>`).join("")}</div>`;
}

function lastRow(p, i) {
  const t = p.last;
  const link = `<span class="lt-link">${pin}지도 앱에서 정확한 막차 보기</span>`;
  const name = `<span class="lt-name"><span class="dot" style="border-color:${P[i]}"></span>${p.name}${p.me ? ' <span class="chip">나만 보여요</span>' : ""}</span>`;
  if (t.kind === "direct")
    return `<li><div class="lt-row"><div class="lt-who">${name}<span class="lt-kind">${t.bound}행 직행 막차</span></div>
      <div class="lt-time"><strong class="tabular">${t.at}</strong>${t.next ? '<span class="tag">다음 날</span>' : ""}</div></div></li>`;
  if (t.kind === "transfer")
    return `<li><div class="lt-row"><div class="lt-who">${name}<span class="lt-kind">갈아타는 길 · 여유를 둔 시각</span></div>
      <div class="lt-time"><small>늦어도</small><strong class="tabular">${t.at}</strong>${t.next ? '<span class="tag">다음 날</span>' : ""}</div></div>${link}</li>`;
  if (t.kind === "hidden")
    return `<li><div class="lt-who">${name}<span class="lt-kind">출발역을 숨긴 분의 막차는 본인에게만 보여요.</span></div></li>`;
  return `<li><div class="lt-who">${name}<span class="lt-kind">${t.why}</span></div>${link}</li>`;
}

function card(c) {
  const lt = c.people.map(lastRow).join("");
  return `<div class="frame">
    <div class="caption">${c.caption}</div>
    <div class="phone">
      <p class="basisline">${c.basis}</p>
      <article class="card">
        <header class="head">
          <svg class="ring" viewBox="0 0 28 28"><circle cx="14" cy="14" r="10.5" fill="#fff" stroke="#16201b" stroke-width="5"/></svg>
          <div><p class="rank"><span>1위</span></p><h2 class="station">${c.station}</h2>
            <span class="badges">${c.badges}</span></div>
        </header>
        ${rails(c.people)}
        ${c.full ? `<dl class="stats tabular"><div><dt>최장</dt><dd>${c.stats[0]}</dd></div><div><dt>차이</dt><dd>${c.stats[1]}</dd></div><div><dt>합계</dt><dd>${c.stats[2]}</dd></div></dl>
        <p class="reason">${c.reason}</p>` : ""}
        <section class="lt">
          <div class="lt-head"><h3>집에 가는 막차</h3><span>${c.ltBasis}</span></div>
          <p class="lt-sub">${c.station}역에서 타는 시각이에요.</p>
          ${c.callout ? `<p class="lt-callout">${c.callout}</p>` : ""}
          <ul class="lt-list">${lt}</ul>
          <p class="lt-note">${c.note}</p>
        </section>
        ${c.full ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="btn-main">이 역으로 정했어요</span>
          <div class="btn-row"><span>지도에서 보기</span><span>길찾기</span></div></div>` : ""}
      </article>
    </div></div>`;
}

const g2 = '<span class="badge round" style="background:#00a84d">2</span>';
const sbd = '<span class="badge" style="background:#d4003b">신분당</span>';
const g5 = '<span class="badge round" style="background:#996cac">5</span>';
const g6 = '<span class="badge round" style="background:#cd7c2f">6</span>';
const NOTE = "2026년 11월 시간표로 계산했어요. 열차가 늦거나 운행이 바뀌면 달라질 수 있으니 타기 전에 한 번 더 확인해 주세요.";

const minsu = { name: "민수", note: "광교에서 · 환승 없음", min: 41, last: { kind: "direct", bound: "광교", at: "00:03", next: true } };
const jiyeon = { name: "지연", note: "부천에서 · 환승 1번", min: 52, last: { kind: "transfer", at: "23:00" } };

const shots = {
  "01-result-direct-transfer": [card({
    caption: "① 결과 화면 1위 카드 · 평일 밤 · 직행 + 환승", basis: "평일 밤 기준", station: "강남", badges: g2 + sbd, full: true,
    people: [minsu, jiyeon], stats: ["52분", "11분", "1시간 33분"],
    reason: "가장 오래 걸리는 지연도 52분이에요. 2위 사당보다 가장 오래 걸리는 사람이 3분 덜 걸려요.",
    ltBasis: "평일 시간표 기준", callout: "<b>지연</b>이 가장 먼저 나서야 해요. 늦어도 <b>23:00</b>이에요.", note: NOTE,
  })],
  "02-result-check-needed": [card({
    caption: "② 평일 밤 · 직행 + 환승 + 확인 필요", basis: "평일 밤 기준", station: "강남", badges: g2 + sbd,
    people: [minsu, jiyeon, { name: "하준", note: "동탄에서 · 환승 2번", min: 58, last: { kind: "check", why: "이 길은 막차 시각을 아직 계산하지 못했어요." } }],
    ltBasis: "평일 시간표 기준", callout: "시각을 아는 사람 중에는 <b>지연</b>이 가장 먼저예요. 늦어도 <b>23:00</b>이에요.", note: NOTE,
  })],
  "03-result-saturday": [card({
    caption: "③-가 토요일 · 1차 출시(시각 없이 버튼만)", basis: "토요일 밤 기준", station: "신당", badges: g2 + g6,
    people: [
      { name: "서연", note: "잠실에서 · 환승 없음", min: 17, last: { kind: "check", why: "토요일 막차 시각은 준비하고 있어요." } },
      { name: "도윤", note: "정발산에서 · 환승 2번", min: 49, last: { kind: "check", why: "토요일 막차 시각은 준비하고 있어요." } },
    ],
    ltBasis: "토요일", callout: "", note: "토요일 시간표가 다 모이면 여기에 시각이 보여요. 그때까지는 지도 앱에서 확인해 주세요.",
  }), card({
    caption: "③-나 토요일 · 시간표가 일부만 채워졌을 때(섞인 경우)", basis: "토요일 밤 기준", station: "신당", badges: g2 + g6,
    people: [
      { name: "서연", note: "잠실에서 · 환승 없음", min: 17, last: { kind: "transfer", at: "23:20" } },
      { name: "도윤", note: "정발산에서 · 환승 2번", min: 49, last: { kind: "check", why: "토요일 막차 시각은 준비하고 있어요." } },
    ],
    ltBasis: "토요일 시간표 기준", callout: "", note: "토요일 시간표가 있는 노선만 계산했어요. 타기 전에 한 번 더 확인해 주세요.",
  })],
  "04-room-hidden": [card({
    caption: "④-가 방 · 출발역을 숨긴 본인(참가자 2)의 화면", basis: "11월 27일 (금) 저녁 기준", station: "강남", badges: g2 + sbd,
    people: [minsu, { name: "참가자 2", me: true, note: "출발역 비공개 · 환승 1번", min: 52, last: { kind: "transfer", at: "23:00" } }],
    ltBasis: "평일 시간표 기준", callout: "", note: NOTE,
  }), card({
    caption: "④-나 같은 방 · 다른 사람(민수)의 화면", basis: "11월 27일 (금) 저녁 기준", station: "강남", badges: g2 + sbd,
    people: [{ ...minsu, me: false, name: "민수" }, { name: "참가자 2", note: "출발역 비공개 · 환승 1번", min: 52, last: { kind: "hidden" } }],
    ltBasis: "평일 시간표 기준", callout: "", note: NOTE,
  })],
};

for (const [id, frames] of Object.entries(shots))
  document.write(`<div class="shot" id="s-${id}">${frames.join("")}</div>`);

document.write(`<div class="shot" id="s-05-share-card"><div>
  <div class="caption">⑤ 공유 카드(/s/og 숫자판, 1200×630) · 저녁·밤 약속일 때만 막차 줄을 더한다</div>
  <div class="og"><div class="og-in">
    <div class="og-brand"><svg width="44" height="44" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff" stroke="#16201b" stroke-width="3"/><path d="M12 2a10 10 0 0 1 0 20z" fill="#16201b"/></svg>반반역</div>
    <div class="og-title">강남에서 볼까?</div>
    <div class="og-people">
      <div class="og-col"><div class="og-name"><span class="og-dot" style="border-color:#1f5bd0"></span>민수</div><div class="og-num">41분</div>
        <div class="og-last"><em>막차</em>00:03</div></div>
      <div class="og-col"><div class="og-name"><span class="og-dot" style="border-color:#e0531c"></span>지연</div><div class="og-num">52분</div>
        <div class="og-last"><em>막차</em>늦어도 23:00</div></div>
    </div>
    <div class="og-chips"><span class="og-chip">차이 11분</span><span class="og-basis">평일 밤 기준</span></div>
    <div class="og-bottom">공평하게 고름 · 막차는 시간표 기준이에요</div>
  </div><div class="og-bar"></div></div></div></div>`);
</script>
</body>
</html>
