# 의존성 버전 업데이트. spikes/는 실험 코드라 대상에서 뺀다(나열한 디렉토리만 검사).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    groups:
      actions:
        patterns: ["*"]
  # web/(pnpm 워크스페이스). 잠금 파일이 루트에 있어 루트 디렉토리를 본다. pnpm-workspace.yaml의 7일 숙성 규칙과
  # 맞추려고 cooldown을 7일로 둔다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
