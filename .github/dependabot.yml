# 의존성 버전 업데이트. spikes/는 실험 코드라 대상에서 뺀다(나열한 디렉토리만 검사).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    # 게시 후 7일 이상 지난 버전만 쓴다는 저장소 규칙에 맞춘다.
    cooldown:
      default-days: 7
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # web/(pnpm 워크스페이스). 잠금 파일이 루트에 있어 루트 디렉토리를 본다. pnpm-workspace.yaml의 7일 숙성 규칙과
  # 맞추려고 cooldown을 7일로 둔다.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # 실행 환경이 Node 24(mise)라 타입도 24에 맞춘다. Node를 올릴 때 함께 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7(네이티브 컴파일러)은 Next.js·typescript-eslint 지원이 확인될 때 별도 작업으로 올린다.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
