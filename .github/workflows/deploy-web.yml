# 웹 배포(Cloudflare Workers + OpenNext). 순서: 빌드(cf:build) → 캐시 채우기(populateCache) → 현재 Worker 버전 기록
# → wrangler deploy → (서버 연결 시) 서버 데이터 대기 → 스모크 테스트.
# 배포를 시작한 뒤 확인까지 끝나지 못하면(실패·단계 시간 초과·취소) 별도 잡 rollback이 기록해 둔 버전을 100%로 되돌린다.
# 트리거: 수동 실행, 또는 deploy.yml(main push)이 부른다(workflow_call). main에서 web/·contracts/·data/artifacts/ 가 바뀌면
# deploy.yml이 서버와 순서를 맞춰 이 워크플로를 부른다(PR은 CI를 통과해야 main에 들어온다). 순서·되돌리기: docs/setup/d104-notes.md.
# 서드파티 액션은 ci.yml과 같은 커밋 SHA로 고정한다.
#
# 설정 값(저장소 Settings → Secrets and variables → Actions):
#   secrets  CLOUDFLARE_API_TOKEN, PROXY_SHARED_SECRET(서버와 같은 값, Worker secret으로 주입)
#   variables CLOUDFLARE_ACCOUNT_ID, POSTHOG_PROJECT_KEY(공개 phc_ 키), POSTHOG_HOST,
#             KAKAO_JS_KEY(카카오 JavaScript 키, 공개 값. 없으면 카카오톡 공유 API 없이 시스템 공유 시트만),
#             SERVER_ORIGIN(서버 Cloud Run 출처, 없으면 API 없이 배포), SITE_DOMAIN(정식 도메인, 없으면 workers.dev만),
#             SITE_INDEX(출시 스위치: true일 때만 검색 노출 허용. 비어 있으면 noindex)
name: deploy-web

on:
  workflow_dispatch:
    inputs:
      measure:
        description: '배포 뒤 경로별 Worker CPU 시간을 실측해 요약에 남긴다(wrangler tail)'
        type: boolean
        default: false
      wait_server_data:
        description: '스모크 전에 서버가 이 빌드의 데이터를 발행할 때까지 기다린다(서버보다 먼저 배포할 때는 끈다)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      measure:
        type: boolean
        default: false
      wait_server_data:
        description: '웹 먼저 순서(서버가 아직 안 바뀐 상태)에서는 false'
        type: boolean
        default: true

permissions:
  contents: read

# 같은 Worker에 동시에 배포하지 않는다. 대기 중인 배포는 취소하지 않고 순서대로 돈다.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 단계마다 timeout을 두고, 그 합(약 90분)보다 잡 제한을 크게 둔다. 그래야 시간 초과는 늘 "단계 실패"로 끝나고
    # 잡 출력(previous·attempted·verified)이 rollback 잡에 전달된다. 보통은 빌드·배포 약 10분 + 서버 데이터 대기 최대 25분.
    timeout-minutes: 100
    outputs:
      previous: ${{ steps.prev.outputs.version }}
      attempted: ${{ steps.attempt.outputs.attempted }}
      verified: ${{ steps.verified.outputs.verified }}
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      # node·pnpm 버전은 mise.toml이 단일 출처다.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        timeout-minutes: 5
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      # 저장소 변수를 검증하고 빌드·배포에 쓸 값을 정한다. 변수 값은 스크립트 본문에 끼워 넣지 않고 환경 변수로만 읽는다.
      - name: 배포 설정 결정
        timeout-minutes: 1
        env:
          VAR_SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          VAR_SERVER_ORIGIN: ${{ vars.SERVER_ORIGIN }}
          VAR_SITE_INDEX: ${{ vars.SITE_INDEX }}
        run: |
          set -euo pipefail
          site_domain="${VAR_SITE_DOMAIN:-}"
          server_origin="${VAR_SERVER_ORIGIN:-}"
          server_origin="${server_origin%/}"
          if [ -n "$site_domain" ] && ! [[ "$site_domain" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$ ]]; then
            echo "::error::SITE_DOMAIN 형식이 올바르지 않습니다(호스트만, 예: example.com)"; exit 1
          fi
          if [ -n "$server_origin" ] && ! [[ "$server_origin" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::SERVER_ORIGIN 형식이 올바르지 않습니다(https 출처만, 경로 없이)"; exit 1
          fi
          {
            echo "SITE_DOMAIN=$site_domain"
            echo "SERVER_ORIGIN=$server_origin"
            # 정식 주소(OG·sitemap·canonical의 기준). 도메인이 없으면 비워 두고, 그러면 모든 페이지가 noindex다.
            if [ -n "$site_domain" ]; then echo "SITE_URL=https://$site_domain"; else echo "SITE_URL="; fi
            # 검색 노출은 출시 스위치(SITE_INDEX=true)와 서버 연결이 모두 있을 때만 켠다. 기본은 noindex(주소·OG는 실제 값 그대로).
            if [ "${VAR_SITE_INDEX:-}" = "true" ] && [ -n "$server_origin" ]; then echo "SITE_NOINDEX="; else echo "SITE_NOINDEX=1"; fi
          } >> "$GITHUB_ENV"
          echo "도메인=${site_domain:-없음(workers.dev)} 서버=${server_origin:-없음(API 미연결)} 색인=$([ "${VAR_SITE_INDEX:-}" = "true" ] && [ -n "$server_origin" ] && echo 허용 || echo noindex)"

      # NEXT_PUBLIC_*·SITE_URL은 빌드 때 번들·정적 페이지에 박힌다(PostHog·카카오 키는 공개 값). 카카오 키가 있으면 CSP에도 카카오 주소가 들어간다.
      - name: 빌드 (cf:build)
        timeout-minutes: 15
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
          API_ORIGIN: ${{ env.SERVER_ORIGIN }}
        run: |
          export NEXT_PUBLIC_APP_VERSION="${GITHUB_SHA::7}"
          pnpm cf:build

      - name: 정적 증분 캐시 채우기 (populateCache)
        timeout-minutes: 5
        run: pnpm exec opennextjs-cloudflare populateCache remote

      # 되돌릴 곳: 배포 직전에 트래픽을 받던 Worker 버전(나뉘어 있으면 가장 큰 쪽, 되돌릴 때 100%로 만든다).
      # 비어 있는 것은 배포 기록이 확실히 없을 때(빈 목록·없는 Worker)뿐이고 그때는 되돌리지 않는다.
      # 그 밖에 읽지 못하면(인증·형식 오류 등) 재시도 뒤 배포 전에 멈춘다(아직 아무것도 바뀌지 않았다).
      - name: 현재 Worker 버전 기록
        id: prev
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          version="$(bash scripts/worker-version.sh current)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "배포 직전 버전: ${version:-없음(첫 배포)}"

      # 권역 색인(부산권 공개) 빌드는 Worker를 공개하기 전에 서버가 권역 세대(manifest 5세대)를 실었는지 확인한다(ADR-0008:
      # 서버가 권역 데이터를 실은 뒤에 웹을 켠다). 순서 옵션(wait_server_data, 웹 먼저)과 상관없이 돈다. 웹 단독 재배포나 웹 먼저
      # 배포에서도 권역 화면이 4세대 서버 앞에 나가지 않게 한다. 실패해도 아직 아무것도 공개하지 않았으므로 되돌릴 것이 없다.
      # 수도권 색인(되돌리기 포함)은 어느 세대의 서버와도 맞으므로 건너뛴다.
      - name: 권역 서버 선행 확인(권역 색인일 때)
        id: regional_precheck
        if: ${{ env.SERVER_ORIGIN != '' }}
        timeout-minutes: 27
        run: |
          if [ "$(jq -r 'has("regions")' src/lib/stations/index.gen.json)" != true ]; then
            echo "수도권 색인: 선행 확인 없음"
            exit 0
          fi
          REGIONAL=true MANIFEST_URL="${SERVER_ORIGIN%/}/v1/manifest" INTERVAL=30 MAX_WAIT=1500 bash scripts/wait-data-version.sh

      # 여기부터 새 버전이 나갈 수 있다. 이 표시가 있고 확인(verified)이 없으면 rollback 잡이 돈다.
      - name: 배포 시작 표시
        id: attempt
        run: echo "attempted=true" >> "$GITHUB_OUTPUT"

      - name: 배포 (wrangler deploy)
        id: deploy
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROXY_SHARED_SECRET: ${{ secrets.PROXY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PROXY_SHARED_SECRET:-}" ]; then echo "::error::PROXY_SHARED_SECRET 이 비어 있습니다"; exit 1; fi
          # 비밀은 파일에 쓰지 않는다: 파일에는 참조만 있고 wrangler가 환경 변수에서 읽는다(배포와 함께 원자적으로 적용).
          secrets_file="$RUNNER_TEMP/web-secrets.env"
          printf 'PROXY_SHARED_SECRET=%s%s\n' '$' '{PROXY_SHARED_SECRET}' > "$secrets_file"
          args=(--secrets-file "$secrets_file" --message "${GITHUB_SHA::7}" --tag "${GITHUB_SHA::7}")
          if [ -n "$SERVER_ORIGIN" ]; then args+=(--var "API_ORIGIN:$SERVER_ORIGIN"); fi
          if [ -n "$SITE_DOMAIN" ]; then
            # 정식 도메인과 www를 Workers Custom Domain으로 붙인다. www·workers.dev로 온 요청은 Worker가 정식 주소로 301 이동시킨다.
            args+=(--var "CANONICAL_HOST:$SITE_DOMAIN" --domain "$SITE_DOMAIN" --domain "www.$SITE_DOMAIN")
          fi
          pnpm exec wrangler deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$secrets_file"
          workers_dev="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)"
          echo "WORKERS_DEV_URL=$workers_dev" >> "$GITHUB_ENV"

      # 같은 커밋의 deploy-server가 새 데이터를 발행하기 전에는 새 역 색인으로 부른 /api/v1/recommend가 400이 된다.
      # 서버 manifest의 dataVersion이 이 웹 빌드(index.gen.json)의 값 이상이 될 때까지 30초 간격, 최대 25분 기다린다
      # (경과 시간 기준, 마지막 요청까지 25분 20초 안. 단계 제한 27분).
      # 더 새 서버 데이터는 통과로 본다(append-only 레지스트리라 옛 색인의 코드도 유효). 이유는 scripts/wait-data-version.sh.
      - name: 서버 데이터 대기
        id: wait
        if: ${{ env.SERVER_ORIGIN != '' && inputs.wait_server_data }}
        timeout-minutes: 27
        run: |
          if [ -n "$SITE_DOMAIN" ]; then export BASE_URL="https://$SITE_DOMAIN"; else export BASE_URL="$WORKERS_DEV_URL"; fi
          INTERVAL=30 MAX_WAIT=1500 bash scripts/wait-data-version.sh

      # 배포된 주소를 직접 확인한다(도메인이 있으면 정식 주소 + www·workers.dev 리디렉트). 카카오 키가 있으면 카카오가 이 출처의 공유를 받는지도.
      - name: 스모크 테스트
        id: smoke
        timeout-minutes: 10
        env:
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            export BASE_URL="https://$SITE_DOMAIN" REDIRECT_FROM="http://$SITE_DOMAIN https://www.$SITE_DOMAIN $WORKERS_DEV_URL"
          else
            export BASE_URL="$WORKERS_DEV_URL"
          fi
          SERVER_CONNECTED=0; SITE_INDEXABLE=0
          if [ -n "$SERVER_ORIGIN" ]; then SERVER_CONNECTED=1; fi
          if [ -n "$SITE_URL" ] && [ -z "$SITE_NOINDEX" ]; then SITE_INDEXABLE=1; fi
          export SERVER_CONNECTED SITE_INDEXABLE
          bash scripts/smoke-deploy.sh

      # 여기까지 오면 새 버전이 확인됐다. 뒤의 선택 단계(measure)가 실패해도 되돌리지 않는다.
      - name: 확인 완료 표시
        id: verified
        run: echo "verified=true" >> "$GITHUB_OUTPUT"

      # 무료 플랜 한도(요청당 CPU 10ms) 대비 여유를 보려는 수동 측정. 수동 실행에서 measure를 켠다.
      - name: Worker CPU 실측 (tail)
        if: ${{ inputs.measure }}
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$SITE_DOMAIN" ]; then export BASE_URL="https://$SITE_DOMAIN"; else export BASE_URL="$WORKERS_DEV_URL"; fi
          node scripts/measure-cpu.ts | tee "$RUNNER_TEMP/cpu.md"
          { echo '### Worker CPU 실측 (ms)'; cat "$RUNNER_TEMP/cpu.md"; } >> "$GITHUB_STEP_SUMMARY"

  # 배포를 시작했는데(attempted) 확인(verified)까지 가지 못했으면 직전 버전을 100%로 되돌린다. 서버의 직전 리비전 되돌리기와 같은 역할.
  # 별도 잡이라 deploy 잡이 실패·단계 시간 초과·취소로 끝나도 자기 시간(20분) 안에서 돈다(always()).
  # 배포 단계에서 실패해 새 버전이 안 나갔으면 worker-version.sh가 "이미 직전 버전 100%"를 보고 아무것도 하지 않는다.
  # 실행을 사람이 취소해도 배포를 시작한 뒤라면 되돌린다(확인 안 된 버전을 남기지 않는다). 첫 배포(previous 없음)는 되돌릴 곳이 없다.
  # 비교·재시도·사후 확인은 scripts/worker-version.sh(테스트: scripts/test-worker-version.sh).
  rollback:
    needs: deploy
    if: ${{ always() && needs.deploy.outputs.attempted == 'true' && needs.deploy.outputs.verified != 'true' && needs.deploy.outputs.previous != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        timeout-minutes: 5
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 8
      - name: 직전 버전으로 되돌리기
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_VERSION: ${{ needs.deploy.outputs.previous }}
        run: |
          set -euo pipefail
          result="$(bash scripts/worker-version.sh rollback "$PREVIOUS_VERSION")"
          echo "$result"
          {
            echo "### 웹 배포가 확인되지 않음 → 직전 버전 100%"
            echo "- 직전 버전: \`${PREVIOUS_VERSION}\`"
            echo "- 결과: ${result}"
            echo "- 이 커밋(${GITHUB_SHA::7})은 서비스되지 않는다. deploy 잡 로그의 실패 단계를 고친 뒤 다시 배포한다."
          } >> "$GITHUB_STEP_SUMMARY"
