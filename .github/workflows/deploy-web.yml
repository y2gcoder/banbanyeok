# 웹 배포(Cloudflare Workers + OpenNext). 순서: 빌드(cf:build) → 캐시 채우기(populateCache) → wrangler deploy → 스모크 테스트.
# 트리거: 수동 실행, 또는 main에서 web/·contracts/·data/artifacts/ 가 바뀔 때(PR은 CI를 통과해야 main에 들어온다).
# 서드파티 액션은 ci.yml과 같은 커밋 SHA로 고정한다.
#
# 설정 값(저장소 Settings → Secrets and variables → Actions):
#   secrets  CLOUDFLARE_API_TOKEN, PROXY_SHARED_SECRET(서버와 같은 값, Worker secret으로 주입)
#   variables CLOUDFLARE_ACCOUNT_ID, POSTHOG_PROJECT_KEY(공개 phc_ 키), POSTHOG_HOST,
#             SERVER_ORIGIN(서버 Cloud Run 출처, 없으면 API 없이 배포), SITE_DOMAIN(정식 도메인, 없으면 workers.dev만)
name: deploy-web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'contracts/**'
      - 'data/artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

# 같은 Worker에 동시에 배포하지 않는다. 대기 중인 배포는 취소하지 않고 순서대로 돈다.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node·pnpm 버전은 mise.toml이 단일 출처다.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile

      # 저장소 변수를 검증하고 빌드·배포에 쓸 값을 정한다. 변수 값은 스크립트 본문에 끼워 넣지 않고 환경 변수로만 읽는다.
      - name: 배포 설정 결정
        env:
          VAR_SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          VAR_SERVER_ORIGIN: ${{ vars.SERVER_ORIGIN }}
        run: |
          set -euo pipefail
          site_domain="${VAR_SITE_DOMAIN:-}"
          server_origin="${VAR_SERVER_ORIGIN:-}"
          server_origin="${server_origin%/}"
          if [ -n "$site_domain" ] && ! [[ "$site_domain" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$ ]]; then
            echo "::error::SITE_DOMAIN 형식이 올바르지 않습니다(호스트만, 예: example.com)"; exit 1
          fi
          if [ -n "$server_origin" ] && ! [[ "$server_origin" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::SERVER_ORIGIN 형식이 올바르지 않습니다(https 출처만, 경로 없이)"; exit 1
          fi
          {
            echo "SITE_DOMAIN=$site_domain"
            echo "SERVER_ORIGIN=$server_origin"
            # 정식 주소(OG·sitemap·canonical의 기준). 도메인이 없으면 비워 두고, 그러면 모든 페이지가 noindex다.
            if [ -n "$site_domain" ]; then echo "SITE_URL=https://$site_domain"; else echo "SITE_URL="; fi
            # 서버가 연결되기 전에는 검색에 노출하지 않는다(입력·결과가 동작하지 않는 사이트가 색인되지 않게).
            if [ -n "$server_origin" ]; then echo "SITE_NOINDEX="; else echo "SITE_NOINDEX=1"; fi
          } >> "$GITHUB_ENV"
          echo "도메인=${site_domain:-없음(workers.dev)} 서버=${server_origin:-없음(API 미연결, noindex)}"

      # NEXT_PUBLIC_*·SITE_URL은 빌드 때 번들·정적 페이지에 박힌다(PostHog 키는 공개 값).
      - name: 빌드 (cf:build)
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          API_ORIGIN: ${{ env.SERVER_ORIGIN }}
        run: |
          export NEXT_PUBLIC_APP_VERSION="${GITHUB_SHA::7}"
          pnpm cf:build

      - name: 정적 증분 캐시 채우기 (populateCache)
        run: pnpm exec opennextjs-cloudflare populateCache remote

      - name: 배포 (wrangler deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROXY_SHARED_SECRET: ${{ secrets.PROXY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PROXY_SHARED_SECRET:-}" ]; then echo "::error::PROXY_SHARED_SECRET 이 비어 있습니다"; exit 1; fi
          # 비밀은 파일에 쓰지 않는다: 파일에는 참조만 있고 wrangler가 환경 변수에서 읽는다(배포와 함께 원자적으로 적용).
          secrets_file="$RUNNER_TEMP/web-secrets.env"
          printf 'PROXY_SHARED_SECRET=%s%s\n' '$' '{PROXY_SHARED_SECRET}' > "$secrets_file"
          args=(--secrets-file "$secrets_file" --message "${GITHUB_SHA::7}" --tag "${GITHUB_SHA::7}")
          if [ -n "$SERVER_ORIGIN" ]; then args+=(--var "API_ORIGIN:$SERVER_ORIGIN"); fi
          if [ -n "$SITE_DOMAIN" ]; then
            # 정식 도메인과 www를 Workers Custom Domain으로 붙인다. www·workers.dev로 온 요청은 Worker가 정식 주소로 301 이동시킨다.
            args+=(--var "CANONICAL_HOST:$SITE_DOMAIN" --domain "$SITE_DOMAIN" --domain "www.$SITE_DOMAIN")
          fi
          pnpm exec wrangler deploy "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$secrets_file"
          workers_dev="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)"
          echo "WORKERS_DEV_URL=$workers_dev" >> "$GITHUB_ENV"

      # 배포된 주소를 직접 확인한다(도메인이 있으면 정식 주소 + www·workers.dev 리디렉트).
      - name: 스모크 테스트
        run: |
          if [ -n "$SITE_DOMAIN" ]; then
            export BASE_URL="https://$SITE_DOMAIN" REDIRECT_FROM="https://www.$SITE_DOMAIN $WORKERS_DEV_URL"
          else
            export BASE_URL="$WORKERS_DEV_URL"
          fi
          SERVER_CONNECTED=0; SITE_INDEXABLE=0
          if [ -n "$SERVER_ORIGIN" ]; then SERVER_CONNECTED=1; fi
          if [ -n "$SITE_URL" ] && [ -z "$SITE_NOINDEX" ]; then SITE_INDEXABLE=1; fi
          export SERVER_CONNECTED SITE_INDEXABLE
          bash scripts/smoke-deploy.sh
