# 배포 오케스트레이터. main push 하나로 서버(deploy-server.yml)와 웹(deploy-web.yml)을 정해진 순서로 배포한다.
#   plan   바뀐 파일(before..sha)로 서버·웹 중 무엇을 배포할지, 병합된 PR의 라벨로 순서를 정한다(scripts/deploy-plan.sh).
#   순서   기본 서버 먼저 → 웹. PR 라벨 `deploy:web-first`가 있으면 웹 먼저 → 서버.
#   실패   앞 단계가 실패하면 뒷 단계는 돌지 않는다(서버·웹 각자 배포 뒤 확인 실패는 스스로 직전 상태로 되돌린다).
#   한쪽만 바뀌면 그쪽만 돈다.
# 두 워크플로는 `workflow_dispatch`도 그대로 있다(한쪽만 수동 배포). 이 워크플로의 수동 실행은 둘을 순서대로 돌린다.
# 라벨 사용법·되돌리기·한계: docs/setup/d104-notes.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: '무엇을 배포할까(둘 다 / 서버만 / 웹만)'
        type: choice
        options: [both, server, web]
        default: both
      order:
        description: '둘 다일 때의 순서'
        type: choice
        options: [server-first, web-first]
        default: server-first

permissions:
  contents: read

# 오케스트레이터 실행끼리 겹치지 않는다. 진행 중인 실행은 취소하지 않고 기다린다.
# 이름이 deploy-server·deploy-web과 달라야 한다(호출되는 워크플로가 같은 그룹을 쓰면 서로 기다리다 멈춘다).
concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # 커밋에 연결된 PR의 라벨을 읽는다
    outputs:
      server: ${{ steps.plan.outputs.server }}
      web: ${{ steps.plan.outputs.web }}
      order: ${{ steps.plan.outputs.order }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # before..sha 비교에 필요
      - name: 배포 계획
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_ORDER: ${{ inputs.order }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/changed-files.txt"
          : > "$files"
          labels=""
          targets=auto
          if [ "$EVENT_NAME" = "push" ]; then
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              # 강제 푸시 등으로 이전 커밋을 모르면 안전하게 둘 다 배포한다.
              echo "::warning::이전 커밋(${BEFORE:0:7})을 찾지 못해 서버·웹을 모두 배포합니다."
              targets=both
            else
              git diff --name-only "$BEFORE" "$GITHUB_SHA" > "$files"
              # 이 푸시에 든 커밋들(보통 스쿼시 커밋 하나)에 연결된 PR의 라벨. 조회가 실패하면 순서를 알 수 없으므로 실패로 멈춘다.
              for sha in $(git rev-list --max-count=20 "${BEFORE}..${GITHUB_SHA}"); do
                labels+="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" --jq '.[].labels[].name')"$'\n'
              done
            fi
          else
            targets="$IN_TARGETS"
          fi
          result="$(TARGETS="$targets" ORDER="${IN_ORDER:-}" PR_LABELS="$labels" bash scripts/deploy-plan.sh < "$files")"
          echo "$result" >> "$GITHUB_OUTPUT"
          {
            echo "### 배포 계획"
            echo "- 변경 파일 $(wc -l < "$files" | tr -d ' ')개, 대상 \`${targets}\`, 이벤트 \`${EVENT_NAME}\`"
            echo "- $(paste -sd' ' - <<<"$result")"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$result"

  # ── 서버 먼저(기본) ──────────────────────────────────────────────
  server-first:
    needs: plan
    if: ${{ needs.plan.outputs.server == 'true' && needs.plan.outputs.order == 'server-first' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit

  web-after-server:
    needs: [plan, server-first]
    # server-first가 건너뛰어진 것(서버 변경 없음)은 괜찮고, 실패·취소면 웹을 돌리지 않는다.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.web == 'true' && needs.plan.outputs.order == 'server-first' && (needs.server-first.result == 'success' || needs.server-first.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  # ── 웹 먼저(라벨 deploy:web-first) ──────────────────────────────
  web-first:
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' && needs.plan.outputs.order == 'web-first' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      # 서버가 같이 바뀌면 서버는 아직 옛 상태라 "서버 데이터 대기"를 건너뛴다. 서버가 안 바뀌면 지금처럼 확인한다.
      wait_server_data: ${{ needs.plan.outputs.server != 'true' }}
    secrets: inherit

  server-after-web:
    needs: [plan, web-first]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.server == 'true' && needs.plan.outputs.order == 'web-first' && (needs.web-first.result == 'success' || needs.web-first.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit
