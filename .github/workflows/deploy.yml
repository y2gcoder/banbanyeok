# 배포 오케스트레이터. main push 하나로 서버(deploy-server.yml)와 웹(deploy-web.yml)을 정해진 순서로 배포한다.
#   plan   지금 운영에 나가 있는 커밋(서버: Cloud Run 100% 리비전의 이미지 태그, 웹: Worker 100% 버전의 tag)과 이 커밋을 비교해
#          서버·웹 중 무엇을 배포할지 정하고, 그 범위의 병합 PR 라벨로 순서를 정한다(scripts/deploy-plan.sh).
#          운영 커밋을 읽지 못하면 그 서비스는 배포한다(조회 단계가 시간 초과여도 마찬가지). 단 둘 다 배포 대상인데 운영 커밋을 하나라도
#          모르면 밀린 범위의 시작을 알 수 없어 순서를 추측하지 않고 plan을 실패시킨다(main에서 이 워크플로를 수동 실행해 order 선택). 그래서 대기 중인 실행이 취소되거나 앞 배포가 실패해도 다음 실행이 따라잡는다.
#   순서   기본 서버 먼저 → 웹. 범위의 PR 중 하나라도 라벨 `deploy:web-first`가 있으면 웹 먼저 → 서버.
#   실패   앞 단계가 실패하면 뒷 단계는 돌지 않는다(서버·웹 각자 배포 뒤 확인 실패는 스스로 직전 상태로 되돌린다).
#   한쪽만 바뀌면 그쪽만 돈다.
# 두 워크플로는 `workflow_dispatch`도 그대로 있다(한쪽만 수동 배포). 이 워크플로의 수동 실행은 둘을 순서대로 돌린다.
# 라벨 사용법·되돌리기·한계: docs/setup/d104-notes.md.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      targets:
        description: '무엇을 배포할까(둘 다 / 서버만 / 웹만 / auto: 운영 커밋과 비교해 밀린 쪽만). 서버를 포함하면 main에서만'
        type: choice
        options: [both, server, web, auto]
        default: both
      order:
        description: '둘 다일 때의 순서(수동 실행은 라벨을 보지 않는다)'
        type: choice
        options: [server-first, web-first]
        default: server-first

permissions:
  contents: read

# 오케스트레이터 실행끼리 겹치지 않는다. 진행 중인 실행은 취소하지 않고 기다린다.
# 대기 중인 실행이 둘 이상이면 GitHub가 앞의 대기 실행을 취소하지만, 마지막 실행의 plan이 운영 커밋 기준으로 밀린 변경을 모두 배포한다.
# 이름이 deploy-server·deploy-web과 달라야 한다(호출되는 워크플로가 같은 그룹을 쓰면 서로 기다리다 멈춘다).
concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # 단계 상한의 합(체크아웃 5 + 인증 3 + 서버 조회 3 + mise 5 + 설치 5 + 웹 조회 3 + 계획 3 = 27분)보다 넉넉히.
    # 선택적 조회 단계가 시간 초과로 끝나도 잡이 먼저 죽어 계획이 없어지지 않게 한다.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read   # 커밋에 연결된 PR의 라벨을 읽는다
      id-token: write       # 운영 서버 리비전 조회(GCP WIF, main 한정)
    outputs:
      server: ${{ steps.plan.outputs.server }}
      web: ${{ steps.plan.outputs.web }}
      order: ${{ steps.plan.outputs.order }}
      server_before: ${{ steps.server.outputs.sha }}
      web_before: ${{ steps.web.outputs.sha }}
      data_before: ${{ steps.data.outputs.version }}
    env:
      # 운영 커밋 비교가 필요한가(push, 또는 수동 auto). 수동으로 대상을 고르면 비교·라벨 조회를 하지 않는다.
      COMPARE: ${{ github.event_name == 'push' || inputs.targets == 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0   # 운영 커밋..HEAD 비교에 필요
      # ── 운영 서버 커밋: 읽지 못해도 실패시키지 않는다(그때는 서버를 배포한다) ──
      - name: GCP 인증(운영 서버 리비전 읽기)
        id: gcp
        if: ${{ env.COMPARE == 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: 운영 서버 커밋 읽기
        id: server
        if: ${{ steps.gcp.outcome == 'success' }}
        continue-on-error: true   # 단계 시간 초과도 빈 SHA(= 서버 배포)로 이어진다. 셸의 fallback은 시간 초과 때 실행되지 않는다
        timeout-minutes: 3
        env:
          CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          REGION: ${{ vars.GCP_REGION }}
        run: |
          if sha="$(bash scripts/deployed-server-sha.sh)"; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "운영 서버 커밋: ${sha:0:7}"
          else
            echo "::warning::운영 서버 커밋을 읽지 못했습니다. 서버를 배포 대상으로 봅니다."
          fi
      # ── 운영 웹 커밋: Worker 버전 tag(wrangler, web/의 고정 버전). 읽지 못하면 웹을 배포한다 ──
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        id: mise
        if: ${{ env.COMPARE == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        with:
          install_args: node pnpm
      - name: wrangler 설치
        id: install
        if: ${{ steps.mise.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 운영 웹 커밋 읽기
        id: web
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true   # 단계 시간 초과도 빈 SHA(= 웹 배포)로 이어진다
        timeout-minutes: 3
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if tag="$(bash scripts/worker-version.sh deployed-tag)"; then
            echo "sha=$tag" >> "$GITHUB_OUTPUT"
            echo "운영 웹 커밋: $tag"
          else
            echo "::warning::운영 웹 커밋을 읽지 못했습니다. 웹을 배포 대상으로 봅니다."
          fi
      - name: 배포 전 서버 데이터 버전 읽기
        id: data
        continue-on-error: true
        timeout-minutes: 2
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: echo "version=$(bash scripts/release-data-version.sh)" >> "$GITHUB_OUTPUT"
      - name: 배포 계획
        id: plan
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          SERVER_DEPLOYED: ${{ steps.server.outputs.sha }}
          WEB_DEPLOYED: ${{ steps.web.outputs.sha }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_ORDER: ${{ inputs.order }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then targets=auto; order=""; else targets="$IN_TARGETS"; order="$IN_ORDER"; fi
          echo "### 배포 계획 (\`${EVENT_NAME}\`, 대상 \`${targets}\`)" >> "$GITHUB_STEP_SUMMARY"
          result="$(TARGETS="$targets" ORDER="$order" SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/deploy-plan.sh)"
          echo "$result" >> "$GITHUB_OUTPUT"
          echo "- 결과: $(paste -sd' ' - <<<"$result")" >> "$GITHUB_STEP_SUMMARY"
          echo "$result"

  # ── 서버 먼저(기본) ──────────────────────────────────────────────
  server-first:
    needs: plan
    if: ${{ needs.plan.outputs.server == 'true' && needs.plan.outputs.order == 'server-first' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit

  web-after-server:
    needs: [plan, server-first]
    # server-first가 건너뛰어진 것(서버 변경 없음)은 괜찮고, 실패·취소면 웹을 돌리지 않는다.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.web == 'true' && needs.plan.outputs.order == 'server-first' && (needs.server-first.result == 'success' || needs.server-first.result == 'skipped') }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    secrets: inherit

  # ── 웹 먼저(라벨 deploy:web-first) ──────────────────────────────
  web-first:
    needs: plan
    if: ${{ needs.plan.outputs.web == 'true' && needs.plan.outputs.order == 'web-first' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-web.yml
    with:
      # 서버가 같이 바뀌면 서버는 아직 옛 상태라 "서버 데이터 대기"를 건너뛴다. 서버가 안 바뀌면 지금처럼 확인한다.
      wait_server_data: ${{ needs.plan.outputs.server != 'true' }}
    secrets: inherit

  server-after-web:
    needs: [plan, web-first]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.server == 'true' && needs.plan.outputs.order == 'web-first' && (needs.web-first.result == 'success' || needs.web-first.result == 'skipped') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-server.yml
    secrets: inherit

  # 배포와 독립된 후처리. 실패해도 배포 잡을 실패시키거나 롤백을 실행하지 않는다.
  release:
    needs: [plan, server-first, web-after-server, web-first, server-after-web]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          (needs.plan.outputs.server == 'true' || needs.plan.outputs.web == 'true') &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
          (needs.plan.outputs.server != 'true' || needs.server-first.result == 'success' || needs.server-after-web.result == 'success') &&
          (needs.plan.outputs.web != 'true' || needs.web-first.result == 'success' || needs.web-after-server.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 날짜 태그 계획(KST, 동일 커밋 재실행 생략)
        id: tag
        run: bash scripts/release-tag.sh >> "$GITHUB_OUTPUT"
      - name: GitHub 릴리즈 생성
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}
          HEAD_SHA: ${{ github.sha }}
          SERVER_NEW: ${{ needs.plan.outputs.server }}
          WEB_NEW: ${{ needs.plan.outputs.web }}
          SERVER_BEFORE: ${{ needs.plan.outputs.server_before }}
          WEB_BEFORE: ${{ needs.plan.outputs.web_before }}
          DATA_BEFORE: ${{ needs.plan.outputs.data_before }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          DATA_AFTER="$(bash scripts/release-data-version.sh)"
          export DATA_AFTER
          bash scripts/create-deploy-release.sh
