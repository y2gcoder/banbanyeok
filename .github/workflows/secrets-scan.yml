# gitleaks로 저장소 전체를 검사한다. 설정은 로컬 pre-commit 훅과 같은 .gitleaks.toml.
name: secrets-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # 매주 월요일: 규칙이 갱신된 뒤 과거 히스토리를 다시 검사

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # 히스토리 전체를 스캔
      # gitleaks 바이너리는 mise.toml에 고정한 버전을 쓴다(별도 서드파티 액션을 쓰지 않음).
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: gitleaks
      - name: 히스토리 스캔
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: 작업 트리 스캔
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
