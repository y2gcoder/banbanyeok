# DB 백업을 지금 한 번 실행한다(수동). 실제 백업은 서울 Cloud Run Job `db-backup`이 하고, 주 1회는 Cloud Scheduler
# (`db-backup-weekly`, 월요일 03:17 KST)가 실행한다. 이 워크플로는 Job을 실행하고 끝날 때까지 기다릴 뿐이라 GitHub 러너는
# DB 비밀번호·덤프·개인정보를 만지지 않는다(pg_dump와 업로드는 Job 안에서만). main에서만 실행된다(WIF 조건).
# 이미지·Job 갱신은 deploy-server.yml이 한다. 설명·복원 절차: docs/setup/p8a-notes.md
name: db-backup

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 필요한 변수 확인
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          missing=0
          for name in PROJECT REGION WIF_PROVIDER DEPLOY_SA; do
            if [ -z "${!name}" ]; then echo "::error::저장소 변수가 없습니다: $name"; missing=1; fi
          done
          exit "$missing"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: db-backup Job 실행·대기
        env:
          CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
          REGION: ${{ vars.GCP_REGION }}
        run: gcloud run jobs execute db-backup --region "$REGION" --wait
