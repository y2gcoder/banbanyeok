# 아키텍처 지표 전용 detekt 덧씌움 설정. detekt-metrics.init.gradle이 config/detekt/detekt.yml 뒤에 겹친다(CI 설정에는 영향 없음).
# 순환 복잡도 10 이상, 인지 복잡도 15 이상 함수를 보고서에 올리려고 임계값을 한 칸 낮춘다. 기준을 바꾸면 이슈의 숫자 기준도 바뀐다.
complexity:
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 9
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 14
