# 버전 카탈로그: Kotlin · kotlinx.serialization · Ktor 버전을 여기서만 고정한다.
# 규칙: 게시 후 7일 이상 지난 안정판만 쓴다(mise의 minimum_release_age 정책과 같음). 확인일 2026-11-12.
[versions]
kotlin = "2.4.21"                  # 2026-10-08 게시. 2.5.0-RC는 안정판이 아니라 제외
kotlinx-serialization = "1.12.0"   # 1.13.0은 2026-11-11 게시라 제외
kotlinx-coroutines = "1.11.0"
# 서버 프레임워크(Ktor vs Spring Boot)는 미정이다. 아래 ktor 항목은 후보로 고정해 둔 값이며 지금은 어떤 모듈도 쓰지 않는다.
ktor = "3.6.1"                     # 2026-10-29 게시
logback = "1.5.38"

[libraries]
# build-logic(컨벤션 플러그인)의 클래스패스로 들어간다. 모듈 빌드 파일은 id("banbanyeok.*")만 쓰고 플러그인 버전을 직접 적지 않는다.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# (후보, 미사용)
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
