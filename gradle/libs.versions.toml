# 버전 카탈로그: Kotlin · kotlinx.serialization · Ktor 버전을 여기서만 고정한다.
# 규칙: 게시 후 7일 이상 지난 안정판만 쓴다(mise의 minimum_release_age 정책과 같음). 확인일 2026-11-12.
[versions]
kotlin = "2.4.21"                  # 2026-10-08 게시. 2.5.0-RC는 안정판이 아니라 제외
kotlinx-serialization = "1.12.0"   # 1.13.0은 2026-11-11 게시라 제외
kotlinx-coroutines = "1.11.0"
# 서버는 Ktor로 확정. 실제 프레임워크 연결은 P3에서 구현한다.
ktor = "3.6.1"                     # 2026-10-29 게시
logback = "1.6.6"

kotest = "6.2.6"
mockk = "1.14.12"
testcontainers = "1.21.4"
konsist = "0.18.1"
ktlint-plugin = "14.1.0"
ktlint = "1.8.0"
detekt = "1.23.8"
postgres-jdbc = "42.7.14"

[libraries]
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
ktlint-gradle = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-plugin" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-postgres = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
postgres-jdbc = { module = "org.postgresql:postgresql", version.ref = "postgres-jdbc" }

# build-logic(컨벤션 플러그인)의 클래스패스로 들어간다. 모듈 빌드 파일은 id("banbanyeok.*")만 쓰고 플러그인 버전을 직접 적지 않는다.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# (P3에서 사용)
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
