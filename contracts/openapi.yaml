openapi: 3.1.0
info:
  title: 반반역 API
  version: 0.1.0-draft
  summary: 방 생성·참여·출발역 입력·결과·무상태 추천 (로그인 없음)
  description: |
    초안(tech-stack 5.2). 소유: S0a 이후 P3(서버)가 이어받는다.

    **이 파일이 웹-서버 계약의 원본이다(contract-first).** 웹은 추천을 직접 계산하지 않고 이 API를 호출한다(코디네이터 결정
    2026-11-12). 웹은 이 파일에서 TS 타입을 생성하고, 서버 구현은 이 계약을 통과해야 한다. 서버 프레임워크는 아직 미정이다.
    역 이름은 응답에 `…Name` 필드로 실어 준다(웹이 레지스트리를 따로 받지 않아도 되게). 숨긴 참가자의 이름 필드는 `null`이다.

    **표시 이름**: 참가자를 화면에 부르는 이름(`Participant.label`)은 서버가 만들어 응답에 넣고, 웹·앱은 다시 만들지 않고 그대로
    쓴다(규칙: contracts/data-format.md §8, 구현: `shared/app-logic` `ParticipantLabels`). 추천 이유 문장도 같은 이름을 쓴다.

    **폐기된 역 코드**: 요청의 역 코드가 레지스트리에서 `deprecated`이면 서버는 `replacedBy`를 따라가 정식(active) 코드로 바꿔
    계산·저장하고, 응답에는 정식 코드를 싣는다(옛 공유 링크가 계속 열리게. data-format §3).

    **신원**: 비회원이다. 알고 있으면 권한이 있는 무작위 **캐퍼빌리티 토큰**을 `Authorization: Bearer`로만 보낸다.
    토큰은 URL·로그·OG·분석 이벤트에 넣지 않는다.

    **숨기기**: 숨긴 참가자의 **출발역 이름(코드)만** 가린다. 그 사람의 소요시간과 환승 횟수는 결과에 그대로 보인다.
    요청자 본인에게는 본인 출발역이 보인다.

    **단위**: 시간은 정수 **초**, 환승은 정수 횟수. 역은 3자 역 코드(contracts/data-format.md §2).

    **데이터 버전**: 방은 생성 시점의 `dataVersion`(manifest의 값)을 기록하고, 결과 응답은 계산에 쓴 버전을 돌려준다.

    **공통 규칙**: 요청 크기 제한(16 KiB, 초과 시 413), IP·기기 단위 속도 제한(초과 시 429와 `Retry-After`), 방 생성과
    참여에 선택적 `Idempotency-Key` 헤더(서버 인스턴스 메모리에서 10분간 같은 응답 재생), 오류는 항상 `{code, message}`.
servers:
  - url: /v1
    description: 같은 출처 rewrite(웹 `/api/*` -> 서버). 로컬 개발은 http://localhost:8080/v1
tags:
  - name: anon
  - name: rooms
  - name: result
  - name: data

paths:
  /healthz:
    get:
      tags: [data]
      operationId: getHealth
      summary: 서버 상태 확인. 웹이 입력 화면에서 서버를 미리 깨울 때도 쓴다
      description: |
        본문은 `ok`이고 저장소·DB를 건드리지 않는다(DB가 깨어나는 중이어도 응답한다). 서버 루트의 `/healthz`(Cloud Run 점검,
        웹의 `/api/healthz` rewrite 대상)와 `/v1/healthz`는 같은 응답이다.
      responses:
        '200':
          description: 정상
          content:
            text/plain:
              schema: {type: string, examples: [ok]}

  /anon:
    post:
      tags: [anon]
      operationId: createAnonymousUser
      summary: 익명 사용자 발급 (첫 방 작업 때 자동 호출)
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema:
                type: object
                required: [anonUserId, deviceToken]
                properties:
                  anonUserId: {type: string}
                  deviceToken: {type: string, description: 기기에 보관하는 비밀 토큰}
        '429': {$ref: '#/components/responses/Error'}

  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 방 생성
      security: [{}, {deviceToken: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoomCreateRequest'}
      responses:
        '201':
          description: 생성됨. 토큰은 이 응답에서만 받는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomCreated'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: 방 상태 (토큰 없이 조회 가능)
      description: 숨긴 참가자의 `originCode`는 `null`이고 `hidden`은 `true`다. participantToken이 있으면 본인 항목은 그대로 보인다.
      security: [{}, {participantToken: []}]
      responses:
        '200':
          description: 방 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Room'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [rooms]
      operationId: updateRoom
      summary: 모드·잠금·약속일 변경 (방장)
      security: [{hostToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoomPatch'}
      responses:
        '200':
          description: 변경된 방
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Room'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: 방 삭제 (방장)
      security: [{hostToken: []}]
      responses:
        '204': {description: 삭제됨}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}/participants:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: 방 참여 (최대 4명, 잠긴 방은 거부)
      security: [{}, {deviceToken: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInput'}
      responses:
        '201':
          description: 참여함
          content:
            application/json:
              schema:
                type: object
                required: [participantId, participantToken]
                properties:
                  participantId: {type: string}
                  participantToken: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409':
          description: 방이 가득 찼거나 잠겼다 (`ROOM_FULL`, `ROOM_LOCKED`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /rooms/{roomId}/participants/{participantId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/ParticipantId'
    put:
      tags: [rooms]
      operationId: updateParticipant
      summary: 자기 출발역·별칭·숨김 수정
      security: [{participantToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInput'}
      responses:
        '200':
          description: 수정된 참가자
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Participant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [rooms]
      operationId: removeParticipant
      summary: 자기 항목 삭제, 또는 방장이 강퇴
      security: [{participantToken: []}, {hostToken: []}]
      responses:
        '204': {description: 삭제됨}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}/result:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [result]
      operationId: getRoomResult
      summary: 서버 계산 결과 (숨긴 방은 필수)
      description: |
        후보 최대 3개 카드를 순위순으로 돌려준다. 숨긴 참가자는 `originCode`가 `null`이고 시간·환승은 보인다.
        participantToken이 있으면 본인 출발역과 경로 상세를 포함한다. 상세 경로 필드는 P3에서 확정한다.
      security: [{}, {participantToken: []}]
      parameters:
        - name: mode
          in: query
          schema: {$ref: '#/components/schemas/Mode'}
        - name: favor
          in: query
          description: '`mode=favor`일 때 우대할 참가자의 participantId'
          schema: {type: string}
      responses:
        '200':
          description: 순위 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: |
            참가자가 2명 미만(`NOT_ENOUGH_PARTICIPANTS`), 또는 참가자의 출발역이 지금 서버가 쓰는 데이터에 없다(`STATION_UNAVAILABLE`,
            방을 만든 뒤 데이터가 바뀐 경우)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /rooms/{roomId}/outcome:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [result]
      operationId: answerOutcome
      summary: '"실제로 어디서 만났나" 응답'
      security: [{participantToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: {type: string, enum: [top1, top3, other, none]}
                stationCode: {$ref: '#/components/schemas/StationCode'}
      responses:
        '204': {description: 기록됨}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /recommend:
    post:
      tags: [result]
      operationId: recommend
      summary: 무상태 계산 (저장 없음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origins, mode]
              properties:
                origins:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items: {$ref: '#/components/schemas/StationCode'}
                mode: {$ref: '#/components/schemas/Mode'}
                favorIndex:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: '`mode=favor`일 때 origins 안의 우대 대상 위치'
                nicknames:
                  type: array
                  maxItems: 4
                  description: |
                    참가자별 선택 이름(별칭). 있으면 `origins`와 같은 길이이고(다르면 400 `INVALID_REQUEST`) 별칭이 없는 사람은 `null`.
                    코드포인트 20자 이하(초과·짝 없는 서로게이트·제어 문자는 400 `INVALID_NICKNAME`). 사람이 이름을 넣지 않았으면
                    `null`로 보내고, 아무도 넣지 않았으면 필드를 생략한다. 응답의 `participants[].nickname`에 그대로 실리고, 표시
                    이름(`participants[].label`)과 `reason` 문장은 이 이름을 쓴다. 없는 사람은 "{출발역}에서 오는 분"이다(data-format §8).
                  items: {type: [string, 'null'], maxLength: 20}
      responses:
        '200':
          description: 순위 결과 (참가자는 입력 순서의 인덱스로 구분)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /manifest:
    get:
      tags: [data]
      operationId: getManifest
      summary: 현재 데이터 manifest (형식은 contracts/data-format.md §5)
      description: 'ETag 조건부 조회를 지원한다. 응답은 짧게 캐시된다 (Cache-Control: public, max-age=60).'
      responses:
        '200':
          description: manifest.json
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '304': {description: 변경 없음}

  /data/{version}/{file}:
    get:
      tags: [data]
      operationId: getDataFile
      summary: 불변 산출물 (stations, candidates, od, seoPages)
      description: '파일 이름에 해시가 들어 있어 Cache-Control: public, max-age=31536000, immutable 로 내보낸다.'
      parameters:
        - name: version
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]{8}\.[0-9]{1,3}$'}
        - name: file
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 파일 본문
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: 익명 사용자 발급 시 받은 기기 토큰(선택). 같은 사용자의 방을 묶는다.
    hostToken:
      type: http
      scheme: bearer
      description: 방 생성 시 한 번만 받는 방장 토큰.
    participantToken:
      type: http
      scheme: bearer
      description: 참가자 항목마다 받는 토큰. 자기 항목만 고칠 수 있다.

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: 10자 Crockford base32 무작위 ID
      schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{10}$'}
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 64}

  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Error:
      type: object
      required: [code, message]
      description: |
        모든 오류 응답의 형식. `message`는 사람이 읽는 설명이고 `code`로 분기한다. 서버가 내는 코드:

        | 상태 | code | 뜻 |
        |---|---|---|
        | 400 | `INVALID_REQUEST` | 본문이 JSON이 아니거나 필드가 없거나 형식이 다르다 |
        | 400 | `INVALID_STATION` | 출발역 코드가 지금 데이터의 출발역에 없다(`/recommend`, 방 생성·참여·출발역 수정) |
        | 400 | `INVALID_PEOPLE_COUNT` | `/recommend`의 참가자가 2~4명이 아니다 |
        | 400 | `INVALID_MODE`, `FAVOR_TARGET_REQUIRED`, `FAVOR_TARGET_UNKNOWN` | 모드가 올바르지 않거나 우대 대상이 없다 |
        | 400 | `INVALID_NICKNAME`, `INVALID_MEETING_DATE`, `INVALID_EXPECTED_COUNT`, `INVALID_OUTCOME`, `INVALID_IDEMPOTENCY_KEY` | 해당 입력이 규칙에 맞지 않는다 |
        | 401 | `UNAUTHORIZED` | 토큰이 없거나 이 방의 토큰이 아니다 (`WWW-Authenticate: Bearer`) |
        | 403 | `FORBIDDEN` | 유효한 토큰이지만 이 작업을 할 수 없다(남의 항목 수정, 방장 전용 작업 등) |
        | 404 | `ROOM_NOT_FOUND`, `PARTICIPANT_NOT_FOUND`, `NOT_FOUND` | 방(만료 포함)·참여자·경로가 없다 |
        | 409 | `ROOM_FULL`, `ROOM_LOCKED` | 참여할 수 없다 |
        | 409 | `NOT_ENOUGH_PARTICIPANTS`, `STATION_UNAVAILABLE` | 방 결과를 계산할 수 없다 |
        | 413 | `PAYLOAD_TOO_LARGE` | 요청 본문이 16 KiB를 넘는다 |
        | 429 | `RATE_LIMITED` | 속도 제한. `Retry-After`(초)를 따른다 |
        | 500 | `INTERNAL_ERROR` | 서버 오류. 내용은 응답에 싣지 않는다 |

        출발역에서 갈 수 없는 후보가 있어 공통 후보가 없는 경우는 오류가 아니라 `Result.status = no_common_candidate`다.
      properties:
        code: {type: string, examples: [ROOM_FULL]}
        message: {type: string}

    StationCode:
      type: string
      description: 3자 역 코드 (contracts/data-format.md §2)
      pattern: '^[0-9a-hjkmnp-tv-z]{3}$'
      examples: [03v]

    Mode:
      type: string
      enum: [fair, fast, favor]
      description: 공평하게 / 빨리 만나기 / 오늘은 ○○ 쪽으로

    ParticipantInput:
      type: object
      required: [originCode]
      properties:
        nickname: {type: string, maxLength: 20}
        originCode: {$ref: '#/components/schemas/StationCode'}
        hidden: {type: boolean, default: false, description: 출발역 이름을 다른 사람에게 가린다(시간은 보인다)}

    Participant:
      type: object
      required: [participantId, hidden, originCode, label, labelKind]
      properties:
        participantId: {type: string}
        nickname: {type: [string, 'null'], description: 사람이 넣은 이름(별칭) 원문. 화면에는 `label`을 쓴다}
        label:
          type: string
          description: |
            화면에 쓰는 표시 이름. **서버가 만들고 클라이언트는 그대로 쓴다**(contracts/data-format.md §8). 이름이 있으면 그 이름,
            없으면 "{출발역 이름}에서 오는 분"(같은 출발역이 여럿이면 입력 순서대로 " 1", " 2"), 출발역을 숨긴 참가자는
            "참가자 {방 안 순번}"이다. 보는 사람과 관계없이 같은 값이며(본인이 숨겼어도 "참가자 N"), 시점 표현("나")과 내부
            식별자를 쓰지 않는다. 보는 사람 표시("(나)")는 클라이언트가 붙인다.
          examples: [민수, 강남에서 오는 분, 강남에서 오는 분 2, 참가자 3]
        labelKind:
          type: string
          enum: [name, origin, ordinal]
          description: '`label`을 무엇으로 만들었는가: 사람이 넣은 이름 / 출발역 / 방 안 순번'

        hidden: {type: boolean}
        originCode:
          description: 숨긴 참가자는 요청자 본인이 아니면 `null`
          oneOf:
            - {$ref: '#/components/schemas/StationCode'}
            - {type: 'null'}
        originName:
          description: originCode의 표시 이름. originCode가 null이면 null
          type: [string, 'null']
        isHost: {type: boolean}
        isSelf: {type: boolean, description: 요청에 담긴 participantToken의 주인이면 true}

    RoomCreateRequest:
      type: object
      required: [mode, host]
      properties:
        mode: {$ref: '#/components/schemas/Mode'}
        favorTarget:
          type: string
          description: '`mode=favor`일 때 우대 대상. 방장은 `host`, 이후 참여자는 participantId'
        meetingDate: {type: string, format: date, description: 약속일(선택). 만료와 "실제로 만났나" 질문 시점에 쓴다}
        host: {$ref: '#/components/schemas/ParticipantInput'}
        expectedCount: {type: integer, minimum: 2, maximum: 4}

    RoomCreated:
      type: object
      required: [roomId, hostToken, participantId, participantToken, expiresAt]
      properties:
        roomId: {type: string}
        hostToken: {type: string}
        participantId: {type: string}
        participantToken: {type: string}
        expiresAt: {type: string, format: date-time}

    RoomPatch:
      type: object
      properties:
        mode: {$ref: '#/components/schemas/Mode'}
        favorTarget: {type: string}
        locked: {type: boolean}
        meetingDate: {type: [string, 'null'], format: date}

    Room:
      type: object
      required: [roomId, mode, locked, expiresAt, dataVersion, participants]
      properties:
        roomId: {type: string}
        mode: {$ref: '#/components/schemas/Mode'}
        favorTarget: {type: [string, 'null']}
        locked: {type: boolean}
        meetingDate: {type: [string, 'null'], format: date}
        expiresAt: {type: string, format: date-time}
        dataVersion: {type: string, description: 방이 기록한 manifest dataVersion}
        participants:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/Participant'}

    PersonalTime:
      type: object
      required: [participantId, seconds, transfers]
      properties:
        participantId: {type: string, description: '/recommend에서는 입력 순서의 인덱스 문자열("0","1",...)'}
        seconds: {type: integer, minimum: 0}
        transfers: {type: integer, minimum: 0}

    Candidate:
      type: object
      required: [rank, stationCode, stationName, times, maxSeconds, spreadSeconds, totalSeconds, reasonCode, reason]
      properties:
        rank: {type: integer, minimum: 1}
        stationCode: {$ref: '#/components/schemas/StationCode'}
        stationName: {type: string, description: 만날 역의 표시 이름}
        times:
          type: array
          description: 참가자 순서는 응답의 `participants`와 같다. 숨긴 참가자의 시간도 보인다.
          items: {$ref: '#/components/schemas/PersonalTime'}
        maxSeconds: {type: integer}
        spreadSeconds: {type: integer}
        totalSeconds: {type: integer}
        favoredSeconds: {type: integer, description: '`mode=favor`일 때 우대 대상의 시간'}
        reasonCode:
          type: string
          enum: [FAIR_MINIMAX, FAIR_ALTERNATIVE, FAST_TOTAL, FAST_ALTERNATIVE, FAVOR_CAPPED, FAVOR_ALTERNATIVE]
        reason:
          type: string
          description: |
            추천 이유 문장(한국어). **서버가 만들어 넣는다**(웹·앱이 같은 문장을 쓰게 하려는 결정). 클라이언트는 문장을 다시
            만들지 않고 그대로 보여 준다. 생성 규칙은 `shared/app-logic`(docs/setup/p6-notes.md). `reasonCode`는 문구와 별개로
            표현(아이콘·강조 등)에 쓰므로 유지한다.

            **시점 표현을 쓰지 않는다**: 같은 결과를 링크를 받은 사람과 만든 사람이 서로 다른 시점에서 읽으므로 "나/너/친구1" 같은
            말 없이 이름으로만 쓴다. 사람을 부르는 이름은 응답의 `participants[].label`과 같다(data-format §8). 보는 사람
            표시("(나)")는 클라이언트가 한다.
          examples: ["가장 오래 걸리는 홍대입구에서 오는 분도 38분이에요. 2위 합정보다 가장 오래 걸리는 사람이 4분 덜 걸려요."]

    Result:
      type: object
      required: [status, mode, dataVersion, participants, candidates]
      properties:
        status:
          type: string
          enum: [ok, no_common_candidate]
          description: |
            `no_common_candidate`는 모든 참가자가 도달할 수 있는 후보역이 없다는 뜻이다(출발역에서 갈 수 없는 후보가 있는 경우를
            포함). 오류가 아니라 정상 응답이고 `candidates`는 비어 있다.
        mode: {$ref: '#/components/schemas/Mode'}
        dataVersion: {type: string, description: 계산에 쓴 manifest dataVersion}
        participants:
          type: array
          items: {$ref: '#/components/schemas/Participant'}
        baselineStationCode:
          description: 엄밀한 공평 1위. favor 상한의 기준
          oneOf:
            - {$ref: '#/components/schemas/StationCode'}
            - {type: 'null'}
        candidates:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/Candidate'}
