openapi: 3.1.0
info:
  title: 반반역 API
  version: 0.1.0-draft
  summary: 방 생성·참여·출발역 입력·결과·무상태 추천 (로그인 없음)
  description: |
    초안(tech-stack 5.2). 소유: S0a 이후 P3(서버)가 이어받는다.

    **이 파일이 웹-서버 계약의 원본이다(contract-first).** 웹은 추천을 직접 계산하지 않고 이 API를 호출한다(코디네이터 결정
    2026-11-12). 웹은 이 파일에서 TS 타입을 생성하고, 서버 구현은 이 계약을 통과해야 한다. 서버 프레임워크는 아직 미정이다.
    역 이름은 응답에 `…Name` 필드로 실어 준다(웹이 레지스트리를 따로 받지 않아도 되게). 숨긴 참가자의 이름 필드는 `null`이다.

    **표시 이름**: 참가자를 화면에 부르는 이름(`Participant.label`)은 서버가 만들어 응답에 넣고, 웹·앱은 다시 만들지 않고 그대로
    쓴다(규칙: contracts/data-format.md §8, 구현: `shared/app-logic` `ParticipantLabels`). 추천 이유 문장도 같은 이름을 쓴다.

    **폐기된 역 코드**: 요청의 역 코드가 레지스트리에서 `deprecated`이면 서버는 `replacedBy`를 따라가 정식(active) 코드로 바꿔
    계산·저장하고, 응답에는 정식 코드를 싣는다(옛 공유 링크가 계속 열리게. data-format §3).

    **신원**: 비회원이다. 알고 있으면 권한이 있는 무작위 **캐퍼빌리티 토큰**을 `Authorization: Bearer`로만 보낸다.
    토큰은 URL·로그·OG·분석 이벤트에 넣지 않는다.

    **숨기기**: 숨긴 참가자의 **출발역 이름(코드)만** 가린다. 그 사람의 소요시간과 환승 횟수는 결과에 그대로 보인다.
    요청자 본인에게는 본인 출발역이 보인다.

    **단위**: 시간은 정수 **초**, 환승은 정수 횟수. 역은 3자 역 코드(contracts/data-format.md §2).

    **데이터 버전**: 방은 생성 시점의 `dataVersion`(manifest의 값)을 기록하고, 결과 응답은 계산에 쓴 버전을 돌려준다.

    **언제 만나나(계산 기준)**: 시간은 요일 유형(평일·토요일·일요일/공휴일) × 시간대(아침·낮·저녁·밤) 구분마다 다르다(배차가 달라
    탑승·환승 대기가 바뀐다. 정의 contracts/time-slots.json, data-format §9). `/recommend`는 구분 id(`timeSlot`)를 직접 받고,
    방은 약속 날짜(`meetingDate`)와 시각(`meetingTime`) 또는 시간대(`meetingBand`, 시각 없이 시간대만 고른 경우)로 서버가 구분을
    정한다(공휴일 목록 contracts/holidays.json). 시간대는 시각이 있으면 시각에서, 없으면 `meetingBand`에서, 둘 다 없으면 낮이다. 날짜가
    없으면 평일이고, 모두 없으면 기본 구분 `weekday-day`(평일 낮)이다 — 구분이 없던 옛 공유 링크(v=1)도 같은 결과가 나온다. 결과 응답의 `timeBasis`는 **실제로 계산한**
    구분과 화면 문구(`label`, 예: "토요일 저녁")이며 클라이언트는 문구를 다시 만들지 않는다. `requestedTimeSlot`은 요청한(방은 날짜·시각에서
    정한) 구분이다. 다음 경우에는 평일 낮으로 대신 계산하고 `timeSlot`이 `weekday-day`가 된다(= `requestedTimeSlot`과 다르다): 데이터에 그
    구분의 행렬이 없을 때(manifest 1세대), 서버가 기동 뒤 구분 행렬 검증에 실패했을 때, 기동 직후 검증이 10초 안에 끝나지 않았을 때.

    **공통 규칙**: 요청 크기 제한(16 KiB, 초과 시 413), IP·기기 단위 속도 제한(초과 시 429와 `Retry-After`), 방 생성과
    참여에 선택적 `Idempotency-Key` 헤더(서버 인스턴스 메모리에서 10분간 같은 응답 재생), 오류는 항상 `{code, message}`.
servers:
  - url: /v1
    description: 같은 출처 rewrite(웹 `/api/*` -> 서버). 로컬 개발은 http://localhost:8080/v1
tags:
  - name: anon
  - name: rooms
  - name: result
  - name: data

paths:
  /healthz:
    get:
      tags: [data]
      operationId: getHealth
      summary: 서버 상태 확인. 웹이 입력 화면에서 서버를 미리 깨울 때도 쓴다
      description: |
        본문은 `ok`이고 저장소·DB를 건드리지 않는다(DB가 깨어나는 중이어도 응답한다). 서버 루트의 `/healthz`(Cloud Run 점검,
        웹의 `/api/healthz` rewrite 대상)와 `/v1/healthz`는 같은 응답이다.
      responses:
        '200':
          description: 정상
          content:
            text/plain:
              schema: {type: string, examples: [ok]}

  /anon:
    post:
      tags: [anon]
      operationId: createAnonymousUser
      summary: 익명 사용자 발급 — **현재 비활성(앱 출시 때 켬)**
      description: |
        **현재 비활성(앱 출시 때 켬).** 서버 설정 `ANON_ENABLED`(기본 `false`)가 켜져 있을 때만 이 경로가 있고, 꺼져 있으면 없는 경로처럼
        404 `NOT_FOUND`다(웹의 `/api/v1/anon` 프록시도 서버의 404를 그대로 돌려준다). 웹은 이 API를 쓰지 않는다(R1 결정: 웹 방은 기기 토큰
        없이 방별 토큰만 쓴다). 앱이 방 기능을 내놓을 때 켜고, 그때 처리방침의 익명 사용자 ID·기기 토큰 항목을 함께 갱신한다(W4).

        결정 변경(R1/W4): 처음 설계는 "첫 방 작업 때 자동 호출"이었다.
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema:
                type: object
                required: [anonUserId, deviceToken]
                properties:
                  anonUserId: {type: string}
                  deviceToken: {type: string, description: 기기에 보관하는 비밀 토큰}
        '404':
          description: 비활성(`ANON_ENABLED=false`, 기본)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 방 생성
      security: [{}, {deviceToken: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoomCreateRequest'}
      responses:
        '201':
          description: 생성됨. 토큰은 이 응답에서만 받는다.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomCreated'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: 방 상태 (토큰 없이 조회 가능)
      description: 숨긴 참가자의 `originCode`는 `null`이고 `hidden`은 `true`다. participantToken이 있으면 본인 항목은 그대로 보인다.
      security: [{}, {participantToken: []}]
      responses:
        '200':
          description: 방 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Room'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [rooms]
      operationId: updateRoom
      summary: 모드·잠금·약속일·약속 시각 변경 (방장)
      security: [{hostToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RoomPatch'}
      responses:
        '200':
          description: 변경된 방
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Room'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: 방 삭제 (방장)
      security: [{hostToken: []}]
      responses:
        '204': {description: 삭제됨}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}/decision:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    put:
      tags: [rooms]
      operationId: setDecision
      summary: 만날 역 정하기·바꾸기·풀기 (참여자 누구나)
      description: |
        `stationCode`가 있으면 그 역으로 정하고(다른 역이 정해져 있으면 바꾼다) null이면 푼다. 역은 만날 역 후보여야 하고 폐기된 코드는
        정식 코드로 바꿔 저장한다. 정하려면 참가자가 2명 이상이어야 한다.

        `seenVersion`은 화면이 본 공유 번호다(결과 카드에서 정하면 그 결과의 `Result.shareVersion`, 그 밖에는 `Room.shareVersion`).
        정한 역 칸이 그 뒤에 바뀌었으면(참여·출발역 변경·나가기·내보내기로 풀렸거나 다른 사람이 정했거나 풀었으면) 409 `ROOM_CHANGED`다.
        별칭·숨기기·잠금·모드·약속 변경은 정함을 풀지 않으므로 409가 나지 않는다. 화면은 방과 결과를 다시 불러 확인한 뒤 다시 누른다.

        이미 그 상태면(같은 역이 정해져 있거나 정한 역 없이 풀기) 아무것도 바꾸지 않고 200이다(재시도 안전, 번호도 그대로).
      security: [{participantToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionRequest'}
      responses:
        '200':
          description: 바뀐(또는 그대로인) 방. 요청자 시점이다(본인 출발역이 보인다)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Room'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: 화면이 본 뒤 방이 바뀌었다(`ROOM_CHANGED`), 또는 참가자가 2명 미만이다(`NOT_ENOUGH_PARTICIPANTS`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}/participants:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: 방 참여 (최대 4명, 잠긴 방은 거부)
      security: [{}, {deviceToken: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInput'}
      responses:
        '201':
          description: 참여함
          content:
            application/json:
              schema:
                type: object
                required: [participantId, participantToken]
                properties:
                  participantId: {type: string}
                  participantToken: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '409':
          description: 방이 가득 찼거나 잠겼다 (`ROOM_FULL`, `ROOM_LOCKED`)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /rooms/{roomId}/participants/{participantId}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/ParticipantId'
    put:
      tags: [rooms]
      operationId: updateParticipant
      summary: 자기 출발역·별칭·숨김 수정
      security: [{participantToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ParticipantInput'}
      responses:
        '200':
          description: 수정된 참가자
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Participant'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [rooms]
      operationId: removeParticipant
      summary: 자기 항목 삭제, 또는 방장이 강퇴
      security: [{participantToken: []}, {hostToken: []}]
      responses:
        '204': {description: 삭제됨}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}/result:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [result]
      operationId: getRoomResult
      summary: 서버 계산 결과 (숨긴 방은 필수)
      description: |
        후보 최대 3개 카드를 순위순으로 돌려준다. 숨긴 참가자는 `originCode`가 `null`이고 시간·환승은 보인다.
        participantToken이 있으면 본인 출발역과 경로 상세를 포함한다. 상세 경로 필드는 P3에서 확정한다.
      security: [{}, {participantToken: []}]
      parameters:
        - name: mode
          in: query
          schema: {$ref: '#/components/schemas/Mode'}
        - name: favor
          in: query
          description: '`mode=favor`일 때 우대할 참가자의 participantId'
          schema: {type: string}
      responses:
        '200':
          description: 순위 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: |
            참가자가 2명 미만(`NOT_ENOUGH_PARTICIPANTS`), 또는 참가자의 출발역이 지금 서버가 쓰는 데이터에 없다(`STATION_UNAVAILABLE`,
            방을 만든 뒤 데이터가 바뀐 경우)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /rooms/{roomId}/preview:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [result]
      operationId: getRoomPreview
      summary: 링크 미리보기 내용 (누구에게나 같은 값)
      description: |
        공유 링크 `/r/{roomId}?sv={n}`의 미리보기(제목·설명·그림)와 공유 문구가 쓰는 방의 지금 상태. 토큰을 보내도 읽지 않는다. 그래서
        누가 묻든 같은 값이고 출발역 필드가 없다(이름은 짧은 이름, 숨긴 사람은 "참가자 N"). 번호(`room.shareVersion`)와 내용은 방을 한 번
        읽은 같은 값에서 나온다.

        결과는 방의 기본 기준(`Room.mode`·`favorTarget`)으로 계산한다. favor 방에서 우대 대상이 나갔으면 첫 참가자를 우대한다.
        단계(`stage`): `collecting`은 2명 미만이거나 모두 갈 수 있는 후보가 없다. `result`는 기본 기준의 1위. `decided`는 정한 역이며
        상위 3곳 밖이어도 그 역까지의 시간을 싣는다.
      security: [{}]
      responses:
        '200':
          description: 미리보기 내용
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RoomPreview'}
        '404': {$ref: '#/components/responses/Error'}
        '409':
          description: 참가자의 출발역이 지금 데이터에 없다(`STATION_UNAVAILABLE`). 클라이언트는 기본 초대 미리보기를 쓴다
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /rooms/{roomId}/outcome:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [result]
      operationId: answerOutcome
      summary: '"실제로 어디서 만났나" 응답'
      security: [{participantToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: {type: string, enum: [top1, top3, other, none]}
                stationCode: {$ref: '#/components/schemas/StationCode'}
      responses:
        '204': {description: 기록됨}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /recommend:
    post:
      tags: [result]
      operationId: recommend
      summary: 무상태 계산 (저장 없음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origins, mode]
              properties:
                origins:
                  type: array
                  minItems: 2
                  maxItems: 4
                  items: {$ref: '#/components/schemas/StationCode'}
                mode: {$ref: '#/components/schemas/Mode'}
                favorIndex:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: '`mode=favor`일 때 origins 안의 우대 대상 위치'
                nicknames:
                  type: array
                  maxItems: 4
                  description: |
                    참가자별 선택 이름(별칭). 있으면 `origins`와 같은 길이이고(다르면 400 `INVALID_REQUEST`) 별칭이 없는 사람은 `null`.
                    코드포인트 20자 이하(초과·짝 없는 서로게이트·제어 문자는 400 `INVALID_NICKNAME`). 사람이 이름을 넣지 않았으면
                    `null`로 보내고, 아무도 넣지 않았으면 필드를 생략한다. 응답의 `participants[].nickname`에 그대로 실리고, 표시
                    이름(`participants[].label`)과 `reason` 문장은 이 이름을 쓴다. 없는 사람은 "{출발역}에서 오는 분"이다(data-format §8).
                  items: {type: [string, 'null'], maxLength: 20}
                timeSlot:
                  description: '언제 만나는가. 생략하거나 null이면 `weekday-day`(평일 낮). 문자열이 아니거나 모르는 id면 400 `INVALID_TIME_SLOT`'
                  oneOf:
                    - {$ref: '#/components/schemas/TimeSlot'}
                    - {type: 'null'}
      responses:
        '200':
          description: 순위 결과 (참가자는 입력 순서의 인덱스로 구분)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Result'}
        '400': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}

  /manifest:
    get:
      tags: [data]
      operationId: getManifest
      summary: 현재 데이터 manifest (형식은 contracts/data-format.md §5)
      description: 'ETag 조건부 조회를 지원한다. 응답은 짧게 캐시된다 (Cache-Control: public, max-age=60).'
      responses:
        '200':
          description: manifest.json
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '304': {description: 변경 없음}

  /data/{version}/{file}:
    get:
      tags: [data]
      operationId: getDataFile
      summary: 불변 산출물 (stations, candidates, od, seoPages)
      description: '파일 이름에 해시가 들어 있어 Cache-Control: public, max-age=31536000, immutable 로 내보낸다.'
      parameters:
        - name: version
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]{8}\.[0-9]{1,3}$'}
        - name: file
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: 파일 본문
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
            application/json:
              schema: {type: object, additionalProperties: true}
        '404': {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: 익명 사용자 발급 시 받은 기기 토큰(선택). 같은 사용자의 방을 묶는다.
    hostToken:
      type: http
      scheme: bearer
      description: 방 생성 시 한 번만 받는 방장 토큰.
    participantToken:
      type: http
      scheme: bearer
      description: 참가자 항목마다 받는 토큰. 자기 항목만 고칠 수 있다.

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: 10자 Crockford base32 무작위 ID
      schema: {type: string, pattern: '^[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{10}$'}
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 64}

  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Error:
      type: object
      required: [code, message]
      description: |
        모든 오류 응답의 형식. `message`는 사람이 읽는 설명이고 `code`로 분기한다. 서버가 내는 코드:

        | 상태 | code | 뜻 |
        |---|---|---|
        | 400 | `INVALID_REQUEST` | 본문이 JSON이 아니거나 필드가 없거나 형식이 다르다 |
        | 400 | `INVALID_STATION` | 출발역 코드가 지금 데이터의 출발역에 없다(`/recommend`, 방 생성·참여·출발역 수정), 또는 정하려는 역이 만날 역 후보가 아니다(`setDecision`) |
        | 400 | `INVALID_PEOPLE_COUNT` | `/recommend`의 참가자가 2~4명이 아니다 |
        | 400 | `INVALID_MODE`, `FAVOR_TARGET_REQUIRED`, `FAVOR_TARGET_UNKNOWN` | 모드가 올바르지 않거나 우대 대상이 없다 |
        | 400 | `INVALID_NICKNAME`, `INVALID_MEETING_DATE`, `INVALID_MEETING_TIME`, `INVALID_MEETING_BAND`, `INVALID_TIME_SLOT`, `INVALID_EXPECTED_COUNT`, `INVALID_OUTCOME`, `INVALID_IDEMPOTENCY_KEY` | 해당 입력이 규칙에 맞지 않는다 |
        | 401 | `UNAUTHORIZED` | 토큰이 없거나 이 방의 토큰이 아니다 (`WWW-Authenticate: Bearer`) |
        | 403 | `FORBIDDEN` | 유효한 토큰이지만 이 작업을 할 수 없다(남의 항목 수정, 방장 전용 작업 등) |
        | 404 | `ROOM_NOT_FOUND`, `PARTICIPANT_NOT_FOUND`, `NOT_FOUND` | 방(만료 포함)·참여자·경로가 없다 |
        | 409 | `ROOM_FULL`, `ROOM_LOCKED` | 참여할 수 없다 |
        | 409 | `NOT_ENOUGH_PARTICIPANTS`, `STATION_UNAVAILABLE` | 방 결과·미리보기를 계산할 수 없거나 2명 미만이라 정할 수 없다 |
        | 409 | `ROOM_CHANGED` | 화면이 본 뒤 방이 바뀌어 정하기·풀기를 받지 않았다(`setDecision`). 방을 다시 불러 확인한 뒤 다시 누른다 |
        | 413 | `PAYLOAD_TOO_LARGE` | 요청 본문이 16 KiB를 넘는다 |
        | 429 | `RATE_LIMITED` | 속도 제한. `Retry-After`(초)를 따른다 |
        | 500 | `INTERNAL_ERROR` | 서버 오류. 내용은 응답에 싣지 않는다 |

        출발역에서 갈 수 없는 후보가 있어 공통 후보가 없는 경우는 오류가 아니라 `Result.status = no_common_candidate`다.
      properties:
        code: {type: string, examples: [ROOM_FULL]}
        message: {type: string}

    StationCode:
      type: string
      description: 3자 역 코드 (contracts/data-format.md §2)
      pattern: '^[0-9a-hjkmnp-tv-z]{3}$'
      examples: [03v]

    Mode:
      type: string
      enum: [fair, fast, favor]
      description: 공평하게 / 빨리 만나기 / 오늘은 ○○ 쪽으로

    TimeSlot:
      type: string
      description: '구분 id = `{요일 유형}-{시간대}` (contracts/time-slots.json). 기본 `weekday-day`'
      enum:
        - weekday-morning
        - weekday-day
        - weekday-evening
        - weekday-night
        - saturday-morning
        - saturday-day
        - saturday-evening
        - saturday-night
        - holiday-morning
        - holiday-day
        - holiday-evening
        - holiday-night

    MeetingTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: 약속 시각 `HH:MM`(24시간, 서울 시각). 03:00 전은 전날 운행일의 밤으로 계산한다
      examples: ['19:30']

    MeetingBand:
      type: string
      enum: [morning, day, evening, night]
      description: |
        약속 시간대(아침 10시 전·낮 10~17시·저녁 17~21시·밤 21시 이후, contracts/time-slots.json의 bands). 정확한 시각 없이 시간대만 고른
        방이 쓴다(서버는 없는 시각을 만들어 저장하지 않는다). 시간대만 고르면 운행일은 약속일 그대로다(밤은 그날 밤).

    TimeBasis:
      type: object
      required: [timeSlot, requestedTimeSlot, dayType, band, label, holidayName]
      description: |
        결과를 계산한 기준(실제로 쓴 구분). 화면의 "○○ 기준" 문구는 `label`을 그대로 쓴다. `timeSlot`이 `requestedTimeSlot`과 다르면 평일 낮으로
        대신 계산한 것이다(조건은 API 설명의 "언제 만나나").
      properties:
        timeSlot: {$ref: '#/components/schemas/TimeSlot'}
        requestedTimeSlot:
          $ref: '#/components/schemas/TimeSlot'
          description: 요청한 구분(`/recommend`의 `timeSlot`, 방은 약속 날짜·시각에서 서버가 정한 구분)
        dayType: {type: string, enum: [weekday, saturday, holiday]}
        band: {type: string, enum: [morning, day, evening, night]}
        label: {type: string, examples: [평일 낮, 토요일 저녁, 일요일·공휴일 밤]}
        holidayName:
          type: [string, 'null']
          description: 방의 약속일이 공휴일이면 그 이름(예 "추석"). 그 밖에는 null

    ParticipantInput:
      type: object
      required: [originCode]
      properties:
        nickname: {type: string, maxLength: 20}
        originCode: {$ref: '#/components/schemas/StationCode'}
        hidden: {type: boolean, default: false, description: 출발역 이름을 다른 사람에게 가린다(시간은 보인다)}

    Participant:
      type: object
      required: [participantId, hidden, originCode, label, labelKind, shortLabel]
      properties:
        participantId: {type: string}
        nickname: {type: [string, 'null'], description: 사람이 넣은 이름(별칭) 원문. 화면에는 `label`을 쓴다}
        label:
          type: string
          description: |
            화면에 쓰는 표시 이름. **서버가 만들고 클라이언트는 그대로 쓴다**(contracts/data-format.md §8). 이름이 있으면 그 이름,
            없으면 "{출발역 이름}에서 오는 분"(같은 출발역이 여럿이면 입력 순서대로 " 1", " 2"), 출발역을 숨긴 참가자는
            "참가자 {방 안 순번}"이다. 보는 사람과 관계없이 같은 값이며(본인이 숨겼어도 "참가자 N"), 시점 표현("나")과 내부
            식별자를 쓰지 않는다. 보는 사람 표시("(나)")는 클라이언트가 붙인다.
          examples: [민수, 강남에서 오는 분, 강남에서 오는 분 2, 참가자 3]
        labelKind:
          type: string
          enum: [name, origin, ordinal]
          description: '`label`을 무엇으로 만들었는가: 사람이 넣은 이름 / 출발역 / 방 안 순번'
        shortLabel:
          type: string
          description: |
            좁은 칸(시간 행·사람 선택 알약·미리보기 그림·미리보기 설명·공유 문구)에 쓰는 짧은 이름. **서버가 만들고 클라이언트는 그대로
            쓴다**(contracts/data-format.md §8). `labelKind`가 `origin`이면 "에서 오는 분"을 뺀 "{출발역 이름}"(번호는 그대로),
            그 밖에는 `label`과 같다. 문장(추천 이유 등)에는 `label`을 쓴다.
          examples: [민수, 강남, 강남 2, 참가자 3]

        hidden: {type: boolean}
        originCode:
          description: 숨긴 참가자는 요청자 본인이 아니면 `null`
          oneOf:
            - {$ref: '#/components/schemas/StationCode'}
            - {type: 'null'}
        originName:
          description: originCode의 표시 이름. originCode가 null이면 null
          type: [string, 'null']
        isHost: {type: boolean}
        isSelf: {type: boolean, description: 요청에 담긴 participantToken의 주인이면 true}

    RoomCreateRequest:
      type: object
      required: [mode, host]
      properties:
        mode: {$ref: '#/components/schemas/Mode'}
        favorTarget:
          type: string
          description: '`mode=favor`일 때 우대 대상. 방장은 `host`, 이후 참여자는 participantId'
        meetingDate:
          type: string
          format: date
          description: '약속일(선택). 만료와 "실제로 만났나" 질문 시점, 계산 구분(요일 유형)에 쓴다'
        meetingTime:
          description: '약속 시각(선택). 계산 구분(시간대)에 쓴다. 생략하거나 null이면 없음(`meetingBand`, 그것도 없으면 낮). 문자열이 아니거나 형식이 틀리면 400 `INVALID_MEETING_TIME`'
          oneOf:
            - {$ref: '#/components/schemas/MeetingTime'}
            - {type: 'null'}
        meetingBand:
          description: |
            약속 시간대(선택). 정확한 시각 없이 시간대만 고른 경우에 보낸다. `meetingTime`과 같이 보내면 그 시각의 시간대와 같아야 한다(다르면 400
            `INVALID_MEETING_BAND`). 생략하거나 null이면 없음. 모르는 값이면 400 `INVALID_MEETING_BAND`
          oneOf:
            - {$ref: '#/components/schemas/MeetingBand'}
            - {type: 'null'}
        host: {$ref: '#/components/schemas/ParticipantInput'}
        expectedCount: {type: integer, minimum: 2, maximum: 4}

    RoomCreated:
      type: object
      required: [roomId, hostToken, participantId, participantToken, expiresAt]
      properties:
        roomId: {type: string}
        hostToken: {type: string}
        participantId: {type: string}
        participantToken: {type: string}
        expiresAt: {type: string, format: date-time}
        roomHash: {$ref: '#/components/schemas/RoomHash'}

    RoomHash:
      type: string
      pattern: '^[0-9a-f]{16}$'
      description: |
        통계 이벤트의 `room_hash`(contracts/events.json)로 그대로 쓰는 값. 방 ID를 되돌릴 수 없다: 하위 키 roomKey = HMAC-SHA256(서버
        비밀 pepper, `banbanyeok/room_hash/v1`)로 HMAC-SHA256(roomKey, 방 ID)의 앞 8바이트를 16자리 소문자 hex로 쓴다(토큰 해시 키와 분리). 키가 서버에만 있어 통계 도구나 값을 본 사람이 방 ID를 전수 대입으로
        찾을 수 없다. 이 필드를 모르는 옛 서버는 보내지 않으므로 클라이언트는 없으면 `room_hash`를 생략한다

    RoomPatch:
      type: object
      properties:
        mode: {$ref: '#/components/schemas/Mode'}
        favorTarget: {type: string}
        locked: {type: boolean}
        meetingDate: {type: [string, 'null'], format: date}
        meetingTime:
          description: '약속 시각. null이면 지운다(`meetingBand`를 같이 보내지 않으면 시간대도 없어진다). 문자열이 아니거나 형식이 틀리면 400 `INVALID_MEETING_TIME`'
          oneOf:
            - {$ref: '#/components/schemas/MeetingTime'}
            - {type: 'null'}
        meetingBand:
          description: |
            약속 시간대. null이면 지운다. 수정 뒤 약속 시각이 있으면 그 시각의 시간대와 같아야 한다(다르면 400 `INVALID_MEETING_BAND`).
            시각을 새로 넣으면 시간대는 시각에서 나온다
          oneOf:
            - {$ref: '#/components/schemas/MeetingBand'}
            - {type: 'null'}

    Room:
      type: object
      required: [roomId, mode, locked, expiresAt, dataVersion, participants]
      properties:
        roomId: {type: string}
        mode: {$ref: '#/components/schemas/Mode'}
        favorTarget: {type: [string, 'null']}
        locked: {type: boolean}
        meetingDate: {type: [string, 'null'], format: date}
        meetingTime:
          oneOf:
            - {$ref: '#/components/schemas/MeetingTime'}
            - {type: 'null'}
        meetingBand:
          description: |
            약속 시간대: 시각이 있으면 그 시각의 시간대, 없으면 고른 시간대, 둘 다 없으면 null(계산은 낮). 시간대만 고른 방은 `meetingTime`이
            null이고 이 값만 있다. 이 필드를 모르는 옛 서버는 보내지 않는다
          oneOf:
            - {$ref: '#/components/schemas/MeetingBand'}
            - {type: 'null'}
        expiresAt: {type: string, format: date-time}
        dataVersion: {type: string, description: 방이 기록한 manifest dataVersion}
        participants:
          type: array
          maxItems: 4
          items: {$ref: '#/components/schemas/Participant'}
        roomHash: {$ref: '#/components/schemas/RoomHash'}
        createdAt:
          type: string
          format: date-time
          description: 방을 만든 시각. 클라이언트가 통계의 `seconds_since_room_created`를 셀 때만 쓴다. 이 필드를 모르는 옛 서버는 보내지 않는다
        shareVersion:
          $ref: '#/components/schemas/ShareVersion'
          description: 지금 방의 공유 번호. 공유 링크의 `?sv=`와 풀기의 `seenVersion`에 쓴다. 이 필드를 모르는 옛 서버는 보내지 않는다
        decision:
          description: |
            방에서 정한 만날 역. 없으면 null. 참여·출발역 변경·나가기·내보내기가 있으면 풀린다. 정한 역이 지금 데이터의 만날 역이 아니면
            없는 것으로 보인다. 이 필드를 모르는 옛 서버는 보내지 않는다
          oneOf:
            - {$ref: '#/components/schemas/Decision'}
            - {type: 'null'}
        timeBasis:
          description: |
            방이 계산할 기준: 약속 날짜(`meetingDate`)·시각(`meetingTime`)·시간대(`meetingBand`)에서 서버가 정한 구분과 화면 문구(`label`). 결과를 계산하기 전(참여자가
            1명이어도)에 참여 화면의 "○○ 기준으로 계산해요"가 이 `label`을 그대로 쓴다. 클라이언트는 날짜로 공휴일·요일을 다시 계산하지 않는다.
            `timeSlot`과 `requestedTimeSlot`은 같다(대신 계산하는 경우는 결과 응답에서만 생긴다).
          $ref: '#/components/schemas/TimeBasis'

    PersonalTime:
      type: object
      required: [participantId, seconds, transfers]
      properties:
        participantId: {type: string, description: '/recommend에서는 입력 순서의 인덱스 문자열("0","1",...)'}
        seconds: {type: integer, minimum: 0}
        transfers: {type: integer, minimum: 0}

    Candidate:
      type: object
      required: [rank, stationCode, stationName, times, maxSeconds, spreadSeconds, totalSeconds, reasonCode, reason]
      properties:
        rank: {type: integer, minimum: 1}
        stationCode: {$ref: '#/components/schemas/StationCode'}
        stationName: {type: string, description: 만날 역의 표시 이름}
        times:
          type: array
          description: 참가자 순서는 응답의 `participants`와 같다. 숨긴 참가자의 시간도 보인다.
          items: {$ref: '#/components/schemas/PersonalTime'}
        maxSeconds: {type: integer}
        spreadSeconds: {type: integer}
        totalSeconds: {type: integer}
        favoredSeconds: {type: integer, description: '`mode=favor`일 때 우대 대상의 시간'}
        reasonCode:
          type: string
          enum: [FAIR_MINIMAX, FAIR_ALTERNATIVE, FAST_TOTAL, FAST_ALTERNATIVE, FAVOR_CAPPED, FAVOR_ALTERNATIVE]
        reason:
          type: string
          description: |
            추천 이유 문장(한국어). **서버가 만들어 넣는다**(웹·앱이 같은 문장을 쓰게 하려는 결정). 클라이언트는 문장을 다시
            만들지 않고 그대로 보여 준다. 생성 규칙은 `shared/app-logic`(docs/setup/p6-notes.md). `reasonCode`는 문구와 별개로
            표현(아이콘·강조 등)에 쓰므로 유지한다.

            **시점 표현을 쓰지 않는다**: 같은 결과를 링크를 받은 사람과 만든 사람이 서로 다른 시점에서 읽으므로 "나/너/친구1" 같은
            말 없이 이름으로만 쓴다. 사람을 부르는 이름은 응답의 `participants[].label`과 같다(data-format §8). 보는 사람
            표시("(나)")는 클라이언트가 한다.
          examples: ["가장 오래 걸리는 홍대입구에서 오는 분도 38분이에요. 2위 합정보다 가장 오래 걸리는 사람이 4분 덜 걸려요."]

    Result:
      type: object
      required: [status, mode, dataVersion, participants, candidates, timeBasis]
      properties:
        status:
          type: string
          enum: [ok, no_common_candidate]
          description: |
            `no_common_candidate`는 모든 참가자가 도달할 수 있는 후보역이 없다는 뜻이다(출발역에서 갈 수 없는 후보가 있는 경우를
            포함). 오류가 아니라 정상 응답이고 `candidates`는 비어 있다.
        mode: {$ref: '#/components/schemas/Mode'}
        dataVersion: {type: string, description: 계산에 쓴 manifest dataVersion}
        participants:
          type: array
          items: {$ref: '#/components/schemas/Participant'}
        timeBasis: {$ref: '#/components/schemas/TimeBasis'}
        baselineStationCode:
          description: 엄밀한 공평 1위. favor 상한의 기준
          oneOf:
            - {$ref: '#/components/schemas/StationCode'}
            - {type: 'null'}
        candidates:
          type: array
          maxItems: 3
          items: {$ref: '#/components/schemas/Candidate'}
        shareVersion:
          $ref: '#/components/schemas/ShareVersion'
          description: 방 결과에만 있다(`/recommend`에는 없다). 이 결과를 계산한 방의 공유 번호이고, 결과 카드에서 정할 때 `seenVersion`으로 보낸다

    ShareVersion:
      type: integer
      format: int64
      minimum: 0
      description: |
        방 공유 번호. 미리보기에 보이는 것(참여자·이름·숨기기·출발역·모드·우대 대상·잠금·약속·정한 역)이 바뀔 때마다 서버(DB)가 올리고
        줄지 않는다. 내용 해시가 아니라서 같은 상태로 돌아와도 번호는 커진다. `dataVersion`(역 데이터 버전)과 다르다.

    Decision:
      type: object
      required: [stationCode, stationName, decidedBy, decidedAt]
      properties:
        stationCode: {$ref: '#/components/schemas/StationCode'}
        stationName: {type: string}
        decidedBy: {type: string, description: '정한 참가자의 participantId. 이름은 `participants[].label`에서 찾는다'}
        decidedAt: {type: string, format: date-time}

    DecisionRequest:
      type: object
      required: [stationCode, seenVersion]
      properties:
        stationCode:
          description: 정할 역. null이면 푼다
          oneOf:
            - {$ref: '#/components/schemas/StationCode'}
            - {type: 'null'}
        seenVersion: {$ref: '#/components/schemas/ShareVersion'}

    RoomPreview:
      description: 링크 미리보기 내용. `stage`로 구별한다
      oneOf:
        - {$ref: '#/components/schemas/RoomPreviewCollecting'}
        - {$ref: '#/components/schemas/RoomPreviewResult'}
        - {$ref: '#/components/schemas/RoomPreviewDecided'}

    RoomPreviewCollecting:
      type: object
      required: [stage, room]
      properties:
        stage: {type: string, const: collecting}
        room: {$ref: '#/components/schemas/PreviewRoom'}

    RoomPreviewResult:
      type: object
      required: [stage, room, dataVersion, basis, station]
      properties:
        stage: {type: string, const: result}
        room: {$ref: '#/components/schemas/PreviewRoom'}
        dataVersion: {type: string, description: 계산에 쓴 manifest dataVersion(그림 주소의 `dv`)}
        basis: {$ref: '#/components/schemas/PreviewBasis'}
        station: {$ref: '#/components/schemas/PreviewStation'}

    RoomPreviewDecided:
      type: object
      required: [stage, room, dataVersion, basis, station, decidedBy, decidedAt]
      properties:
        stage: {type: string, const: decided}
        room: {$ref: '#/components/schemas/PreviewRoom'}
        dataVersion: {type: string, description: 계산에 쓴 manifest dataVersion(그림 주소의 `dv`)}
        basis: {$ref: '#/components/schemas/PreviewBasis'}
        station: {$ref: '#/components/schemas/PreviewStation'}
        decidedBy: {type: string, description: 정한 사람의 짧은 이름(숨긴 사람은 "참가자 N")}
        decidedAt: {type: string, format: date-time}

    PreviewRoom:
      type: object
      required: [roomId, shareVersion, participantCount, canJoin, meetingDate, meetingTime, meetingBand, timeBasis]
      properties:
        roomId: {type: string}
        shareVersion: {$ref: '#/components/schemas/ShareVersion'}
        participantCount: {type: integer, minimum: 0, maximum: 4}
        canJoin: {type: boolean, description: 지금 링크로 새로 들어올 수 있다(자리가 있고 잠기지 않았다)}
        meetingDate: {type: [string, 'null'], format: date}
        meetingTime:
          oneOf:
            - {$ref: '#/components/schemas/MeetingTime'}
            - {type: 'null'}
        meetingBand:
          oneOf:
            - {$ref: '#/components/schemas/MeetingBand'}
            - {type: 'null'}
        timeBasis:
          description: 약속 날짜·시각에서 정한 계산 기준과 문구(`Room.timeBasis`와 같다)
          $ref: '#/components/schemas/TimeBasis'

    PreviewBasis:
      type: object
      required: [mode, favorLabel]
      description: 방의 기본 기준(보는 사람이 고른 탭이 아니다)
      properties:
        mode: {$ref: '#/components/schemas/Mode'}
        favorLabel: {type: [string, 'null'], description: '`mode=favor`일 때 우대하는 사람의 짧은 이름'}

    PreviewStation:
      type: object
      required: [stationCode, stationName, times]
      properties:
        stationCode: {$ref: '#/components/schemas/StationCode'}
        stationName: {type: string}
        times:
          type: array
          maxItems: 4
          description: 참여 순서
          items: {$ref: '#/components/schemas/PreviewTime'}

    PreviewTime:
      type: object
      required: [label, seconds]
      properties:
        label: {type: string, description: 짧은 이름(`Participant.shortLabel`). 숨긴 사람은 "참가자 N"}
        seconds: {type: [integer, 'null'], minimum: 0, description: 그 역까지 걸리는 시간(초). 갈 수 없으면 null}
