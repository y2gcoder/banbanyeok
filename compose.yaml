services:
  db:
    image: postgres:${POSTGRES_VERSION:-17.6}
    environment:
      POSTGRES_DB: banbanyeok
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d banbanyeok"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    # 운영과 같은 Dockerfile로 PostgreSQL JDBC까지 포함한다(5.0 기본 이미지에는 드라이버가 없음).
    build:
      context: .
      dockerfile: server/db/Dockerfile
      args:
        # 2026-08-20 게시(Docker Hub tags API), 2026-11-24 확인: 7일 경과.
        LIQUIBASE_IMAGE: liquibase/liquibase:5.0.4@sha256:060f96efff4811ccf03957ff3160f21ea04139b89940640f8ad54a065cdc6906
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server/db/changelog:/liquibase/changelog:ro
    command:
      - --search-path=/liquibase/changelog
      - --changelog-file=master.sql
      - --url=jdbc:postgresql://db:5432/banbanyeok
      - --username=local
      - --password=local-development-only
      - update
volumes:
  postgres-data:
